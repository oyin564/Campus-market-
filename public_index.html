<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Market</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  body { margin: 0; }
  .cm-display { font-family: 'Permanent Marker', cursive; letter-spacing: 0.5px; }
  .cm-hand { font-family: 'Caveat', cursive; }
  .cm-body { font-family: 'Inter', sans-serif; }
  .cm-mono { font-family: 'Space Mono', monospace; }
  .cm-card { background: #FBF7EC; box-shadow: 0 6px 14px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.4) inset; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .cm-card:hover { transform: translateY(-3px) rotate(0deg) !important; box-shadow: 0 12px 22px rgba(0,0,0,0.32), 0 1px 0 rgba(255,255,255,0.4) inset; }
  .cm-tape { position: absolute; width: 46px; height: 18px; background: rgba(240, 200, 70, 0.55); box-shadow: 0 1px 2px rgba(0,0,0,0.15); top: -9px; left: 50%; transform: translateX(-50%) rotate(-3deg); }
  .cm-chalk-border { border: 2px dashed rgba(243,240,231,0.35); }
  .cm-thumb { width: 100%; height: 96px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; background: #EFE9D8; }
  .cm-scrollbar::-webkit-scrollbar { width: 8px; }
  .cm-scrollbar::-webkit-scrollbar-thumb { background: rgba(243,240,231,0.25); border-radius: 8px; }
  @keyframes cm-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .cm-fade-up { animation: cm-fade-up 0.35s ease both; }
  @keyframes cm-slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .cm-slide-in { animation: cm-slide-in 0.28s cubic-bezier(0.16,1,0.3,1) both; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------------------------------------------------------
   API client — talks to the real backend (server.js).
   Change the base URL below if you deploy the backend elsewhere.
--------------------------------------------------------- */
const DEFAULT_API_BASE = ""; // same origin as this page — works locally and once deployed, no CORS needed
function getApiBase() { return localStorage.getItem("cm_api_base") || DEFAULT_API_BASE; }
function setApiBase(v) { localStorage.setItem("cm_api_base", v); }

async function api(path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${getApiBase()}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const money = (n) => `₦${Number(n || 0).toLocaleString()}`;
const CATEGORIES = ["Snacks & Drinks", "Books & Notes", "Stationery & Printing", "Clothing", "Tech & Repairs", "Other"];
const DELIVERY_FEE = 500;

/* ------------------------------ Theming ------------------------------ */
const BOARD_BG = "#1F3B31";
const BOARD_BG_2 = "#213F34";
const CHALK = "#F3F0E7";
const CHALK_YELLOW = "#F0C846";
const CHALK_CORAL = "#E8735F";
const CHALK_BLUE = "#8FC1D4";
const CARD_PAPER = "#FBF7EC";

/* --------------------------------- App --------------------------------- */
function App() {
  const [role, setRole] = useState("buyer");
  const [buyerAuth, setBuyerAuth] = useState(() => {
    const token = localStorage.getItem("cm_buyer_token");
    const username = localStorage.getItem("cm_buyer_username");
    const displayName = localStorage.getItem("cm_buyer_displayname");
    return token && username ? { token, username, displayName } : null;
  });
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const [products, setProducts] = useState([]);
  const [vendors, setVendors] = useState([]);
  const [dataLoaded, setDataLoaded] = useState(false);
  const [activeProduct, setActiveProduct] = useState(null);
  const [showApiSettings, setShowApiSettings] = useState(false);

  async function refreshData() {
    try {
      const [p, v] = await Promise.all([api("/api/products"), api("/api/vendors")]);
      setProducts(p.products || []);
      setVendors(v.vendors || []);
      setDataLoaded(true);
    } catch (e) {
      console.error("Failed to load data:", e.message);
      setDataLoaded(true);
    }
  }

  useEffect(() => { refreshData(); }, []);

  function signInBuyer({ token, username, displayName }) {
    localStorage.setItem("cm_buyer_token", token);
    localStorage.setItem("cm_buyer_username", username);
    localStorage.setItem("cm_buyer_displayname", displayName);
    setBuyerAuth({ token, username, displayName });
  }
  function signOutBuyer() {
    localStorage.removeItem("cm_buyer_token");
    localStorage.removeItem("cm_buyer_username");
    localStorage.removeItem("cm_buyer_displayname");
    setBuyerAuth(null);
  }
  function updateDisplayName(newName) {
    localStorage.setItem("cm_buyer_displayname", newName);
    setBuyerAuth((p) => ({ ...p, displayName: newName }));
  }

  const vendorOf = (id) => vendors.find((v) => v.id === id) || { id, name: "Unknown seller", tag: "" };

  const filtered = useMemo(() => {
    return products.filter((p) => {
      const matchesCat = category === "All" || p.category === category;
      const q = query.trim().toLowerCase();
      const matchesQuery = q === "" || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || (p.desc || "").toLowerCase().includes(q);
      return matchesCat && matchesQuery;
    });
  }, [query, category, products]);

  const related = useMemo(() => {
    if (!query.trim() || filtered.length > 0) return [];
    const q = query.trim().toLowerCase();
    return products.filter((p) => p.name.toLowerCase().split(" ").some((w) => q.includes(w) || w.includes(q))).slice(0, 4);
  }, [query, filtered, products]);

  return (
    <div className="min-h-screen w-full" style={{ background: BOARD_BG }}>
      <TopBar role={role} setRole={setRole} buyerAuth={buyerAuth} onOpenApiSettings={() => setShowApiSettings(true)} />

      {role === "buyer" ? (
        !buyerAuth ? (
          <BuyerGate onSignedIn={signInBuyer} />
        ) : (
          <BuyerView
            buyerAuth={buyerAuth}
            onSwitchBuyer={signOutBuyer}
            onUpdateDisplayName={updateDisplayName}
            query={query} setQuery={setQuery}
            category={category} setCategory={setCategory}
            filtered={filtered} related={related}
            products={products}
            vendorOf={vendorOf}
            dataLoaded={dataLoaded}
            onOpenChat={(p) => setActiveProduct(p)}
          />
        )
      ) : role === "vendor" ? (
        <VendorArea vendors={vendors} products={products} vendorOf={vendorOf} onDataChanged={refreshData} />
      ) : (
        <OwnerArea vendorOf={vendorOf} />
      )}

      {activeProduct && buyerAuth && (
        <ChatPanel
          product={activeProduct}
          vendor={vendorOf(activeProduct.vendorId)}
          buyerAuth={buyerAuth}
          onClose={() => setActiveProduct(null)}
        />
      )}

      {showApiSettings && <ApiSettingsModal onClose={() => { setShowApiSettings(false); refreshData(); }} />}
    </div>
  );
}

function ApiSettingsModal({ onClose }) {
  const [value, setValue] = useState(getApiBase());
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
      <div className="absolute inset-0" style={{ background: "rgba(0,0,0,0.55)" }} onClick={onClose} />
      <div className="relative w-full max-w-sm rounded-lg p-5" style={{ background: CARD_PAPER }}>
        <h3 className="cm-display text-lg mb-2" style={{ color: "#2b2b2b" }}>Backend URL</h3>
        <p className="cm-body text-xs mb-3" style={{ color: "#7a7a7a" }}>
          Point this at wherever your backend is running — <code>http://localhost:3001</code> while testing locally, or your deployed URL once it's live.
        </p>
        <input value={value} onChange={(e) => setValue(e.target.value)}
          className="cm-body w-full text-sm rounded-md px-3 py-2 border mb-3" style={{ borderColor: "#d8cfb4" }} />
        <button onClick={() => { setApiBase(value); onClose(); }}
          className="cm-body w-full text-sm font-semibold rounded-md py-2.5" style={{ background: "#20301f", color: CHALK_YELLOW }}>
          Save & reload data
        </button>
      </div>
    </div>
  );
}

/* ------------------------------- Top bar ------------------------------- */
function TopBar({ role, setRole, buyerAuth, onOpenApiSettings }) {
  return (
    <div className="w-full border-b" style={{ borderColor: "rgba(243,240,231,0.15)", background: BOARD_BG_2 }}>
      <div className="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-center gap-2">
          <span className="text-2xl">🏫</span>
          <h1 className="cm-display text-2xl" style={{ color: CHALK_YELLOW }}>Campus Market</h1>
        </div>
        <div className="flex items-center gap-3">
          <div className="flex rounded-full p-1" style={{ background: "rgba(243,240,231,0.08)" }}>
            <button onClick={() => setRole("buyer")} className="cm-body text-sm px-3 py-1.5 rounded-full transition"
              style={{ background: role === "buyer" ? CHALK_YELLOW : "transparent", color: role === "buyer" ? "#20301f" : CHALK, fontWeight: role === "buyer" ? 600 : 400 }}>
              {buyerAuth ? `Hi, ${buyerAuth.displayName.split(" ")[0]}` : "I'm shopping"}
            </button>
            <button onClick={() => setRole("vendor")} className="cm-body text-sm px-3 py-1.5 rounded-full transition"
              style={{ background: role === "vendor" ? CHALK_YELLOW : "transparent", color: role === "vendor" ? "#20301f" : CHALK, fontWeight: role === "vendor" ? 600 : 400 }}>
              🏬 I sell here
            </button>
          </div>
          <button onClick={() => setRole("owner")} title="Management" className="p-2 rounded-full"
            style={{ background: role === "owner" ? CHALK_YELLOW : "rgba(243,240,231,0.08)", color: role === "owner" ? "#20301f" : "rgba(243,240,231,0.6)" }}>
            ⚙
          </button>
          <button onClick={onOpenApiSettings} title="Backend URL" className="p-2 rounded-full text-xs" style={{ background: "rgba(243,240,231,0.08)", color: "rgba(243,240,231,0.6)" }}>
            🔗
          </button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------ Buyer gate ------------------------------ */
function BuyerGate({ onSignedIn }) {
  const [mode, setMode] = useState("login");
  const [stage, setStage] = useState("form");
  const [username, setUsername] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [email, setEmail] = useState("");
  const [pin, setPin] = useState("");
  const [confirmPin, setConfirmPin] = useState("");
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [pending, setPending] = useState(null);

  function switchMode(next) { setMode(next); setStage("form"); setError(""); setPin(""); setConfirmPin(""); setCode(""); setPending(null); }

  async function submitSignup() {
    setError(""); setBusy(true);
    try {
      const data = await api("/api/buyers/signup", { method: "POST", body: { username, displayName, email, pin } });
      onSignedIn(data);
    } catch (e) { setError(e.message); }
    setBusy(false);
  }

  async function submitLogin() {
    setError(""); setBusy(true);
    try {
      const data = await api("/api/buyers/login", { method: "POST", body: { username, pin } });
      setPending({ username, devCode: data.devCode, emailSent: data.emailSent });
      setStage("verify");
    } catch (e) { setError(e.message); }
    setBusy(false);
  }

  async function submitCode() {
    setError(""); setBusy(true);
    try {
      const data = await api("/api/buyers/verify", { method: "POST", body: { username: pending.username, code } });
      onSignedIn(data);
    } catch (e) { setError(e.message); }
    setBusy(false);
  }

  if (stage === "verify" && pending) {
    return (
      <div className="max-w-sm mx-auto px-5 pt-14 pb-24 text-center">
        <h2 className="cm-display text-2xl mb-1" style={{ color: CHALK }}>Check your email</h2>
        <p className="cm-body text-sm mb-3" style={{ color: "rgba(243,240,231,0.7)" }}>
          {pending.emailSent ? "We emailed you a 6-digit code." : "We'd normally email a code, but no mail provider is configured on the backend yet."}
        </p>
        {!pending.emailSent && (
          <div className="cm-body text-xs rounded-md px-3 py-2 mb-4" style={{ background: "rgba(240,200,70,0.12)", color: CHALK_YELLOW, border: "1px dashed rgba(240,200,70,0.4)" }}>
            Demo mode — here's the code the server generated: <strong>{pending.devCode}</strong>
          </div>
        )}
        <input autoFocus value={code} onChange={(e) => setCode(e.target.value.replace(/[^0-9]/g, ""))} onKeyDown={(e) => e.key === "Enter" && submitCode()}
          placeholder="6-digit code" inputMode="numeric" maxLength={6}
          className="cm-body w-full text-sm rounded-md px-3 py-2 border mb-2 text-center tracking-widest"
          style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
        {error && <p className="cm-body text-xs mb-2" style={{ color: CHALK_CORAL }}>{error}</p>}
        <button disabled={busy} onClick={submitCode} className="cm-body w-full text-sm font-semibold rounded-md px-4 py-2.5 mb-2 disabled:opacity-40" style={{ background: CHALK_YELLOW, color: "#20301f" }}>
          {busy ? "Checking..." : "Verify & log in"}
        </button>
        <button onClick={() => setStage("form")} className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.5)" }}>← back</button>
      </div>
    );
  }

  const submit = mode === "login" ? submitLogin : submitSignup;

  return (
    <div className="max-w-sm mx-auto px-5 pt-14 pb-24 text-center">
      <h2 className="cm-display text-2xl mb-1" style={{ color: CHALK }}>{mode === "login" ? "Log in to shop" : "Create your account"}</h2>
      <p className="cm-body text-sm mb-4" style={{ color: "rgba(243,240,231,0.7)" }}>
        {mode === "login" ? "Use your username and PIN — we'll email a code to confirm it's you." : "Pick a unique username — you can change your display name anytime after."}
      </p>
      <div className="flex rounded-full p-1 mb-4 mx-auto" style={{ background: "rgba(243,240,231,0.08)", maxWidth: 260 }}>
        <button onClick={() => switchMode("login")} className="cm-body flex-1 text-sm px-3 py-1.5 rounded-full"
          style={{ background: mode === "login" ? CHALK_YELLOW : "transparent", color: mode === "login" ? "#20301f" : CHALK }}>Log in</button>
        <button onClick={() => switchMode("signup")} className="cm-body flex-1 text-sm px-3 py-1.5 rounded-full"
          style={{ background: mode === "signup" ? CHALK_YELLOW : "transparent", color: mode === "signup" ? "#20301f" : CHALK }}>Sign up</button>
      </div>
      <div className="space-y-2 text-left">
        <div>
          <label className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.6)" }}>Username</label>
          <input autoFocus value={username} onChange={(e) => setUsername(e.target.value)} placeholder="e.g. tega_01"
            className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
        </div>
        {mode === "signup" && (
          <div>
            <label className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.6)" }}>Display name</label>
            <input value={displayName} onChange={(e) => setDisplayName(e.target.value)} placeholder="e.g. Tega"
              className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
          </div>
        )}
        {mode === "signup" && (
          <div>
            <label className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.6)" }}>Email</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com"
              className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
          </div>
        )}
        <div>
          <label className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.6)" }}>PIN</label>
          <input value={pin} onChange={(e) => setPin(e.target.value.replace(/[^0-9]/g, ""))} onKeyDown={(e) => e.key === "Enter" && mode === "login" && submit()}
            placeholder="4-digit PIN" inputMode="numeric" maxLength={6}
            className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
        </div>
        {mode === "signup" && (
          <div>
            <label className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.6)" }}>Confirm PIN</label>
            <input value={confirmPin} onChange={(e) => setConfirmPin(e.target.value.replace(/[^0-9]/g, ""))} onKeyDown={(e) => e.key === "Enter" && submit()}
              placeholder="Re-enter PIN" inputMode="numeric" maxLength={6}
              className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
          </div>
        )}
      </div>
      {error && <p className="cm-body text-xs mt-3" style={{ color: CHALK_CORAL }}>{error}</p>}
      <button disabled={busy} onClick={() => {
        if (mode === "signup" && pin !== confirmPin) { setError("PINs don't match."); return; }
        submit();
      }} className="cm-body w-full text-sm font-semibold rounded-md px-4 py-2.5 mt-4 disabled:opacity-40" style={{ background: CHALK_YELLOW, color: "#20301f" }}>
        {busy ? "Checking..." : mode === "login" ? "Send login code" : "Create account"}
      </button>
    </div>
  );
}

/* ------------------------------ Buyer view ------------------------------ */
function BuyerView({ buyerAuth, onSwitchBuyer, onUpdateDisplayName, query, setQuery, category, setCategory, filtered, related, products, vendorOf, dataLoaded, onOpenChat }) {
  const cats = ["All", ...CATEGORIES];
  const [recommended, setRecommended] = useState([]);
  const [recLabel, setRecLabel] = useState("Popular on the board");
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState(buyerAuth.displayName);
  const [savingName, setSavingName] = useState(false);

  async function saveDisplayName() {
    if (!nameDraft.trim()) return;
    setSavingName(true);
    try {
      await api("/api/buyers/me", { method: "PATCH", body: { displayName: nameDraft.trim() }, token: buyerAuth.token });
      onUpdateDisplayName(nameDraft.trim());
      setEditingName(false);
    } catch (e) { alert(e.message); }
    setSavingName(false);
  }

  useEffect(() => {
    (async () => {
      try {
        const { orders } = await api("/api/orders/mine", { token: buyerAuth.token });
        if (!orders || orders.length === 0) { setRecommended(products.slice(0, 6)); setRecLabel("Popular on the board"); return; }
        const freq = {};
        orders.forEach((o) => {
          const p = products.find((pr) => pr.id === o.product_id);
          if (p) freq[p.category] = (freq[p.category] || 0) + 1;
        });
        const topCats = Object.entries(freq).sort((a, b) => b[1] - a[1]).map(([c]) => c);
        const boughtIds = new Set(orders.map((o) => o.product_id));
        const picks = products.filter((p) => topCats.includes(p.category)).sort((a, b) => (boughtIds.has(a.id) ? 1 : 0) - (boughtIds.has(b.id) ? 1 : 0)).slice(0, 6);
        setRecommended(picks.length ? picks : products.slice(0, 6));
        setRecLabel("Because you've ordered from these categories before");
      } catch { setRecommended(products.slice(0, 6)); }
    })();
  }, [buyerAuth.username, products]);

  return (
    <div className="max-w-5xl mx-auto px-5 pb-24">
      <div className="pt-10 pb-2 text-center cm-fade-up">
        <p className="cm-hand text-2xl mb-1" style={{ color: CHALK_BLUE }}>psst — need something on campus?</p>
        <h2 className="cm-display text-3xl md:text-4xl leading-tight" style={{ color: CHALK }}>
          Search it. Chat the seller. <span style={{ color: CHALK_CORAL }}>Get it delivered.</span>
        </h2>
        {editingName ? (
          <div className="flex items-center justify-center gap-1.5 mt-2 max-w-xs mx-auto">
            <input autoFocus value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveDisplayName()}
              className="cm-body text-xs rounded-md px-2 py-1 border flex-1" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
            <button disabled={savingName} onClick={saveDisplayName} className="cm-body text-xs font-semibold rounded-md px-2 py-1" style={{ background: CHALK_YELLOW, color: "#20301f" }}>
              {savingName ? "..." : "Save"}
            </button>
            <button onClick={() => { setEditingName(false); setNameDraft(buyerAuth.displayName); }} style={{ color: "rgba(243,240,231,0.5)" }}>✕</button>
          </div>
        ) : (
          <div className="flex items-center justify-center gap-3 mt-2">
            <button onClick={onSwitchBuyer} className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.5)" }}>↩ not {buyerAuth.displayName}? switch</button>
            <button onClick={() => setEditingName(true)} className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.5)" }}>✎ edit name</button>
          </div>
        )}
      </div>

      <div className="cm-fade-up rounded-xl p-3 flex items-center gap-2 cm-chalk-border mt-6" style={{ background: "rgba(243,240,231,0.06)" }}>
        <span style={{ color: CHALK }}>🔍</span>
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search for snacks, textbooks, printing, repairs..."
          className="cm-body flex-1 bg-transparent outline-none text-base py-1" style={{ color: CHALK }} />
        {query && <button onClick={() => setQuery("")} style={{ color: CHALK }}>✕</button>}
      </div>

      <div className="flex gap-2 flex-wrap mt-4">
        {cats.map((c) => (
          <button key={c} onClick={() => setCategory(c)} className="cm-body text-sm px-3 py-1.5 rounded-full border transition"
            style={{ borderColor: category === c ? CHALK_YELLOW : "rgba(243,240,231,0.25)", color: category === c ? "#20301f" : CHALK, background: category === c ? CHALK_YELLOW : "transparent", fontWeight: category === c ? 600 : 400 }}>
            {c}
          </button>
        ))}
      </div>

      {!query.trim() && recommended.length > 0 && (
        <div className="mt-8">
          <h3 className="cm-body text-sm font-semibold mb-3" style={{ color: CHALK_YELLOW }}>✨ {recLabel}</h3>
          <ProductGrid products={recommended} vendorOf={vendorOf} onOpenChat={onOpenChat} />
          <div className="my-8" style={{ borderBottom: "2px dashed rgba(243,240,231,0.2)" }} />
        </div>
      )}

      {!dataLoaded ? (
        <p className="cm-body text-sm text-center mt-10" style={{ color: "rgba(243,240,231,0.6)" }}>loading the board...</p>
      ) : filtered.length === 0 ? (
        <div className="mt-10 text-center cm-fade-up">
          <p className="cm-hand text-2xl" style={{ color: CHALK }}>nothing pinned to the board matches "{query}" yet</p>
          {related.length > 0 && (
            <>
              <p className="cm-body text-sm mt-1 mb-4" style={{ color: "rgba(243,240,231,0.7)" }}>you might mean one of these:</p>
              <ProductGrid products={related} vendorOf={vendorOf} onOpenChat={onOpenChat} />
            </>
          )}
        </div>
      ) : (
        <div className="mt-8">
          <h3 className="cm-body text-sm font-semibold mb-3" style={{ color: CHALK_YELLOW }}>All listings</h3>
          <ProductGrid products={filtered} vendorOf={vendorOf} onOpenChat={onOpenChat} />
        </div>
      )}
    </div>
  );
}

function ProductGrid({ products, vendorOf, onOpenChat }) {
  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      {products.map((p, i) => {
        const vendor = vendorOf(p.vendorId);
        const rotate = (i % 3 === 0) ? "-1.5deg" : (i % 3 === 1) ? "1deg" : "-0.5deg";
        return (
          <div key={p.id} className="cm-card cm-fade-up relative rounded-sm p-4 pt-6" style={{ transform: `rotate(${rotate})`, animationDelay: `${i * 40}ms` }}>
            <div className="cm-tape rounded-sm" />
            {p.imageUrl ? (
              <img src={`${getApiBase()}${p.imageUrl}`} alt={p.name} className="cm-thumb" onError={(e) => { e.target.style.display = "none"; }} />
            ) : (
              <div className="text-3xl mb-2">{p.icon || "🛍️"}</div>
            )}
            <h3 className="cm-body font-semibold text-[15px] leading-snug" style={{ color: "#2b2b2b" }}>{p.name}</h3>
            <p className="cm-body text-xs mt-1 mb-3" style={{ color: "#5a5a5a" }}>{p.desc}</p>
            <div className="flex items-center justify-between mb-3">
              <span className="cm-mono text-sm font-bold" style={{ color: "#2b2b2b" }}>{money(p.price)}</span>
              <span className="cm-body text-[11px] px-2 py-0.5 rounded-full" style={{ background: "#EFE9D8", color: "#5a5a5a" }}>{vendor.name}</span>
            </div>
            <button onClick={() => onOpenChat(p)} className="cm-body w-full text-sm font-semibold rounded-md py-2" style={{ background: "#20301f", color: CHALK_YELLOW }}>
              💬 Chat with seller
            </button>
          </div>
        );
      })}
    </div>
  );
}

/* ------------------------------ Chat panel ------------------------------ */
function ChatPanel({ product, vendor, buyerAuth, onClose }) {
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState("");
  const [loading, setLoading] = useState(true);
  const [showOrderForm, setShowOrderForm] = useState(false);
  const [orderSent, setOrderSent] = useState(false);
  const bottomRef = useRef(null);

  async function loadMessages() {
    try {
      const data = await api(`/api/messages/${product.id}/${buyerAuth.username}`);
      setMessages(data.messages || []);
    } catch (e) { console.error(e); }
    setLoading(false);
  }

  useEffect(() => { loadMessages(); }, [product.id, buyerAuth.username]);
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  async function sendMessage() {
    if (!draft.trim()) return;
    const text = draft.trim();
    setDraft("");
    try {
      await api("/api/messages", { method: "POST", body: { productId: product.id, text }, token: buyerAuth.token });
      await loadMessages();
    } catch (e) { alert(e.message); }
  }

  return (
    <div className="fixed inset-0 z-40 flex justify-end">
      <div className="absolute inset-0" style={{ background: "rgba(0,0,0,0.45)" }} onClick={onClose} />
      <div className="cm-slide-in relative w-full sm:w-[420px] h-full flex flex-col cm-scrollbar" style={{ background: CARD_PAPER }}>
        <div className="flex items-center gap-3 px-4 py-4 border-b" style={{ borderColor: "#e5ddc8" }}>
          <button onClick={onClose} style={{ color: "#2b2b2b" }}>←</button>
          {product.imageUrl ? <img src={`${getApiBase()}${product.imageUrl}`} className="w-9 h-9 rounded object-cover" /> : <div className="text-2xl">{product.icon || "🛍️"}</div>}
          <div className="flex-1 min-w-0">
            <p className="cm-body font-semibold text-sm truncate" style={{ color: "#2b2b2b" }}>{product.name}</p>
            <p className="cm-body text-xs" style={{ color: "#7a7a7a" }}>{vendor.name} · {vendor.tag}</p>
          </div>
          <button onClick={onClose} style={{ color: "#2b2b2b" }}>✕</button>
        </div>

        <div className="flex-1 overflow-y-auto cm-scrollbar px-4 py-4 space-y-3">
          <div className="cm-body text-xs text-center py-2 px-3 rounded-lg mx-auto max-w-[85%]" style={{ background: "#EFE9D8", color: "#7a7a7a" }}>
            Chatting about <strong>{product.name}</strong> (listed at {money(product.price)}). Agree on a final price here, then send the order below.
          </div>
          {loading ? <p className="cm-body text-xs text-center" style={{ color: "#9a9a9a" }}>loading...</p>
            : messages.length === 0 ? <p className="cm-hand text-lg text-center mt-6" style={{ color: "#9a9a9a" }}>say hi to get things moving 👋</p>
            : messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === "buyer" ? "justify-end" : "justify-start"}`}>
                <div className="cm-body text-sm max-w-[78%] px-3 py-2 rounded-2xl"
                  style={{ background: m.sender === "buyer" ? "#20301f" : "#EFE9D8", color: m.sender === "buyer" ? CHALK_YELLOW : "#2b2b2b" }}>
                  {m.text}
                </div>
              </div>
            ))}
          <div ref={bottomRef} />
        </div>

        <div className="px-3 py-3 border-t flex items-center gap-2" style={{ borderColor: "#e5ddc8" }}>
          <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && sendMessage()}
            placeholder="Type a message..." className="cm-body flex-1 text-sm rounded-full px-4 py-2 border" style={{ borderColor: "#d8cfb4" }} />
          <button onClick={sendMessage} className="p-2.5 rounded-full" style={{ background: "#20301f", color: CHALK_YELLOW }}>➤</button>
        </div>

        <div className="px-4 pb-4">
          {orderSent ? (
            <div className="cm-body text-sm rounded-lg px-3 py-3" style={{ background: "#dff0d8", color: "#2b5a2b" }}>
              ✓ Order sent — {vendor.name} and management have it. Delivery fee is ₦{DELIVERY_FEE}, payable by transfer or cash.
            </div>
          ) : (
            <button onClick={() => setShowOrderForm(true)} className="cm-body w-full text-sm font-semibold rounded-md py-2.5" style={{ background: CHALK_YELLOW, color: "#20301f" }}>
              📦 Ready to order — send delivery details
            </button>
          )}
        </div>
      </div>

      {showOrderForm && (
        <OrderForm product={product} vendor={vendor} buyerAuth={buyerAuth} onClose={() => setShowOrderForm(false)} onSent={() => { setShowOrderForm(false); setOrderSent(true); }} />
      )}
    </div>
  );
}

/* ------------------------------ Order form ------------------------------ */
function OrderForm({ product, vendor, buyerAuth, onClose, onSent }) {
  const [qty, setQty] = useState(1);
  const [agreedPrice, setAgreedPrice] = useState(product.price);
  const [location, setLocation] = useState("");
  const [phone, setPhone] = useState("");
  const [notes, setNotes] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("transfer");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const grandTotal = (Number(agreedPrice) || 0) * qty + DELIVERY_FEE;

  async function submit() {
    if (!location.trim() || !phone.trim() || !agreedPrice || Number(agreedPrice) <= 0) { setError("Fill in location, phone, and a valid price."); return; }
    setSubmitting(true);
    try {
      await api("/api/orders", { method: "POST", token: buyerAuth.token, body: { productId: product.id, qty, agreedPrice: Number(agreedPrice), paymentMethod, location, phone, notes } });
      onSent();
    } catch (e) { setError(e.message); }
    setSubmitting(false);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
      <div className="absolute inset-0" style={{ background: "rgba(0,0,0,0.55)" }} onClick={onClose} />
      <div className="cm-fade-up relative w-full max-w-sm rounded-lg p-5 max-h-[90vh] overflow-y-auto cm-scrollbar" style={{ background: CARD_PAPER }}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="cm-display text-lg" style={{ color: "#2b2b2b" }}>Delivery details</h3>
          <button onClick={onClose} style={{ color: "#7a7a7a" }}>✕</button>
        </div>
        <p className="cm-body text-xs mb-4" style={{ color: "#7a7a7a" }}>{product.icon || "🛍️"} {product.name} — from {vendor.name}</p>
        <div className="space-y-3">
          <div className="flex gap-2">
            <div className="flex-1">
              <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Quantity</label>
              <input type="number" min={1} value={qty} onChange={(e) => setQty(Math.max(1, +e.target.value))}
                className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "#d8cfb4" }} />
            </div>
            <div className="flex-1">
              <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Price agreed (₦/item)</label>
              <input type="number" min={1} value={agreedPrice} onChange={(e) => setAgreedPrice(e.target.value)}
                className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "#d8cfb4" }} />
            </div>
          </div>
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Delivery location</label>
            <input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Hostel B, Room 214"
              className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "#d8cfb4" }} />
          </div>
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Phone number</label>
            <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="e.g. 080..."
              className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "#d8cfb4" }} />
          </div>
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Payment method</label>
            <div className="flex gap-2 mt-1">
              {["transfer", "cash"].map((m) => (
                <button key={m} type="button" onClick={() => setPaymentMethod(m)} className="cm-body flex-1 text-sm rounded-md py-2 border capitalize"
                  style={{ borderColor: paymentMethod === m ? "#20301f" : "#d8cfb4", background: paymentMethod === m ? "#20301f" : "transparent", color: paymentMethod === m ? CHALK_YELLOW : "#5a5a5a" }}>
                  {m}
                </button>
              ))}
            </div>
          </div>
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Notes (optional)</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2}
              className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1 resize-none" style={{ borderColor: "#d8cfb4" }} />
          </div>
        </div>
        <div className="cm-body text-xs rounded-md px-3 py-2 mt-3 space-y-0.5" style={{ background: "#EFE9D8", color: "#5a5a5a" }}>
          <div className="flex justify-between"><span>{qty} × {money(agreedPrice)}</span><span>{money((Number(agreedPrice) || 0) * qty)}</span></div>
          <div className="flex justify-between"><span>Delivery fee</span><span>{money(DELIVERY_FEE)}</span></div>
          <div className="flex justify-between font-bold pt-1 border-t mt-1" style={{ borderColor: "#d8cfb4", color: "#2b2b2b" }}>
            <span>Total ({paymentMethod})</span><span>{money(grandTotal)}</span>
          </div>
        </div>
        {error && <p className="cm-body text-xs mt-2" style={{ color: CHALK_CORAL }}>{error}</p>}
        <button disabled={submitting} onClick={submit} className="cm-body w-full mt-4 text-sm font-semibold rounded-md py-2.5 disabled:opacity-40" style={{ background: "#20301f", color: CHALK_YELLOW }}>
          {submitting ? "Sending..." : "Send order"}
        </button>
      </div>
    </div>
  );
}

/* ---------------------------- Vendor area ---------------------------- */
function VendorArea({ vendors, products, vendorOf, onDataChanged }) {
  const [stage, setStage] = useState("pick");
  const [selected, setSelected] = useState(null); // { id, name, tag }
  const [isNew, setIsNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [newTag, setNewTag] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [vendorAuth, setVendorAuth] = useState(() => {
    const token = localStorage.getItem("cm_vendor_token");
    const id = localStorage.getItem("cm_vendor_id");
    const name = localStorage.getItem("cm_vendor_name");
    const tag = localStorage.getItem("cm_vendor_tag");
    return token && id ? { token, id, name, tag } : null;
  });
  const [dashboardConvo, setDashboardConvo] = useState(null);

  function persistVendorAuth(v) {
    localStorage.setItem("cm_vendor_token", v.token);
    localStorage.setItem("cm_vendor_id", v.id);
    localStorage.setItem("cm_vendor_name", v.name);
    localStorage.setItem("cm_vendor_tag", v.tag || "");
    setVendorAuth(v);
  }
  function switchShop() {
    localStorage.removeItem("cm_vendor_token"); localStorage.removeItem("cm_vendor_id");
    localStorage.removeItem("cm_vendor_name"); localStorage.removeItem("cm_vendor_tag");
    setVendorAuth(null); setStage("pick"); setSelected(null); setPassword(""); setError("");
  }

  async function registerNewVendor() {
    if (!newName.trim()) { setError("Give your shop a name."); return; }
    if (password.trim().length < 4) { setError("Password needs to be at least 4 characters."); return; }
    setBusy(true); setError("");
    try {
      const data = await api("/api/vendors/register", { method: "POST", body: { name: newName, tag: newTag, password } });
      persistVendorAuth({ token: data.token, id: data.id, name: data.name, tag: data.tag });
      await onDataChanged();
      setStage("dashboard");
    } catch (e) { setError(e.message); }
    setBusy(false);
  }

  async function loginExisting(v) {
    setBusy(true); setError("");
    try {
      const data = await api("/api/vendors/login", { method: "POST", body: { id: v.id, password } });
      persistVendorAuth({ token: data.token, id: data.id, name: data.name, tag: data.tag });
      setStage("dashboard");
    } catch (e) { setError(e.message); }
    setBusy(false);
  }

  if (vendorAuth && stage !== "dashboard") setStage("dashboard");

  if (stage === "pick") {
    return (
      <div className="max-w-3xl mx-auto px-5 pt-10 pb-24">
        <div className="cm-fade-up mb-6 text-center">
          <p className="cm-hand text-2xl mb-1" style={{ color: CHALK_BLUE }}>seller check-in</p>
          <h2 className="cm-display text-3xl" style={{ color: CHALK }}>Who's setting up shop?</h2>
        </div>
        <div className="grid sm:grid-cols-2 gap-3 mb-6">
          {vendors.map((v) => (
            <button key={v.id} onClick={() => { setSelected(v); setIsNew(false); setPassword(""); setError(""); setStage("auth"); }} className="cm-card text-left rounded-md p-4">
              <p className="cm-body font-semibold text-sm" style={{ color: "#2b2b2b" }}>{v.name}</p>
              <p className="cm-body text-xs mt-0.5" style={{ color: "#7a7a7a" }}>{v.tag}</p>
            </button>
          ))}
        </div>
        <div className="cm-card rounded-md p-4">
          <p className="cm-body text-sm font-semibold mb-2" style={{ color: "#2b2b2b" }}>+ Register a new shop</p>
          <div className="space-y-2">
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Shop name" className="cm-body w-full text-sm rounded-md px-3 py-2 border" style={{ borderColor: "#d8cfb4" }} />
            <input value={newTag} onChange={(e) => setNewTag(e.target.value)} placeholder="Where to find you" className="cm-body w-full text-sm rounded-md px-3 py-2 border" style={{ borderColor: "#d8cfb4" }} />
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Set a shop password" className="cm-body w-full text-sm rounded-md px-3 py-2 border" style={{ borderColor: "#d8cfb4" }} />
            {error && <p className="cm-body text-xs" style={{ color: CHALK_CORAL }}>{error}</p>}
            <button disabled={busy} onClick={registerNewVendor} className="cm-body text-sm font-semibold rounded-md px-4 py-2" style={{ background: "#20301f", color: CHALK_YELLOW }}>
              {busy ? "..." : "Continue"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (stage === "auth" && selected) {
    return (
      <div className="max-w-sm mx-auto px-5 pt-16 pb-24 text-center">
        <h2 className="cm-display text-2xl mb-1" style={{ color: CHALK }}>{selected.name}</h2>
        <p className="cm-body text-sm mb-4" style={{ color: "rgba(243,240,231,0.7)" }}>Enter your shop's password to continue.</p>
        <input type="password" autoFocus value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && loginExisting(selected)}
          placeholder="Password" className="cm-body w-full text-sm rounded-md px-3 py-2 border mb-2" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
        {error && <p className="cm-body text-xs mb-2" style={{ color: CHALK_CORAL }}>{error}</p>}
        <div className="flex gap-2">
          <button onClick={() => setStage("pick")} className="cm-body flex-1 text-sm rounded-md px-4 py-2" style={{ background: "rgba(243,240,231,0.1)", color: CHALK }}>Back</button>
          <button disabled={busy} onClick={() => loginExisting(selected)} className="cm-body flex-1 text-sm font-semibold rounded-md px-4 py-2 disabled:opacity-40" style={{ background: CHALK_YELLOW, color: "#20301f" }}>
            {busy ? "..." : "Unlock"}
          </button>
        </div>
      </div>
    );
  }

  return (
    <VendorDashboard vendorAuth={vendorAuth} products={products.filter((p) => p.vendorId === vendorAuth.id)}
      onDataChanged={onDataChanged} dashboardConvo={dashboardConvo} setDashboardConvo={setDashboardConvo} onSwitchShop={switchShop} />
  );
}

function VendorDashboard({ vendorAuth, products, onDataChanged, dashboardConvo, setDashboardConvo, onSwitchShop }) {
  const [orders, setOrders] = useState([]);
  const [loadingOrders, setLoadingOrders] = useState(true);
  const [showAddItem, setShowAddItem] = useState(false);

  useEffect(() => {
    (async () => {
      try { const data = await api("/api/orders/vendor", { token: vendorAuth.token }); setOrders(data.orders || []); }
      catch (e) { console.error(e); }
      setLoadingOrders(false);
    })();
  }, [vendorAuth.id]);

  return (
    <div className="max-w-5xl mx-auto px-5 pb-24 pt-10">
      <div className="cm-fade-up mb-8 flex items-start justify-between flex-wrap gap-3">
        <div>
          <p className="cm-hand text-2xl mb-1" style={{ color: CHALK_BLUE }}>seller view</p>
          <h2 className="cm-display text-3xl" style={{ color: CHALK }}>{vendorAuth.name}'s counter</h2>
          <p className="cm-body text-sm mt-1" style={{ color: "rgba(243,240,231,0.7)" }}>{vendorAuth.tag}</p>
        </div>
        <button onClick={onSwitchShop} className="cm-body text-xs rounded-full px-3 py-1.5" style={{ background: "rgba(243,240,231,0.1)", color: CHALK }}>Switch shop</button>
      </div>

      <div className="mb-8">
        <div className="flex items-center justify-between mb-3">
          <h3 className="cm-body text-sm font-semibold" style={{ color: CHALK_YELLOW }}>📦 Your listings</h3>
          <button onClick={() => setShowAddItem(true)} className="cm-body text-xs font-semibold rounded-full px-3 py-1.5" style={{ background: CHALK_YELLOW, color: "#20301f" }}>+ List an item</button>
        </div>
        {products.length === 0 ? (
          <p className="cm-hand text-lg" style={{ color: "rgba(243,240,231,0.6)" }}>nothing listed yet — add your first item</p>
        ) : (
          <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-3">
            {products.map((p) => (
              <div key={p.id} className="cm-card rounded-md p-3">
                {p.imageUrl && <img src={`${getApiBase()}${p.imageUrl}`} className="cm-thumb" style={{ height: 70 }} />}
                <div className="flex items-center gap-2 mb-1"><span className="text-xl">{p.icon || "🛍️"}</span><span className="cm-body text-sm font-semibold" style={{ color: "#2b2b2b" }}>{p.name}</span></div>
                <p className="cm-mono text-xs font-bold mb-2" style={{ color: "#2b2b2b" }}>{money(p.price)}</p>
                <button onClick={() => setDashboardConvo(p)} className="cm-body w-full text-xs rounded-md py-1.5" style={{ background: "#EFE9D8", color: "#2b2b2b" }}>💬 View chats</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div>
        <h3 className="cm-body text-sm font-semibold mb-3" style={{ color: CHALK_YELLOW }}>📋 Orders sent to you</h3>
        {loadingOrders ? <p className="cm-body text-xs" style={{ color: "rgba(243,240,231,0.6)" }}>loading...</p>
          : orders.length === 0 ? <p className="cm-hand text-lg" style={{ color: "rgba(243,240,231,0.6)" }}>no orders yet</p>
          : (
            <div className="grid sm:grid-cols-2 gap-3">
              {orders.slice().reverse().map((o) => (
                <div key={o.id} className="cm-card rounded-md p-3">
                  <p className="cm-body text-sm font-semibold" style={{ color: "#2b2b2b" }}>{o.qty}× {o.product_name} @ {money(o.agreed_price)}</p>
                  <p className="cm-body text-xs mt-1" style={{ color: "#5a5a5a" }}>📍 {o.location}</p>
                  <p className="cm-body text-xs" style={{ color: "#5a5a5a" }}>📞 {o.phone} · from {o.buyer_display_name}</p>
                  <p className="cm-body text-xs mt-1" style={{ color: "#7a7a7a" }}>{o.payment_method === "cash" ? "Pays cash on delivery" : "Pays by transfer"}</p>
                  {o.notes && <p className="cm-body text-xs mt-1 italic" style={{ color: "#7a7a7a" }}>"{o.notes}"</p>}
                </div>
              ))}
            </div>
          )}
      </div>

      {dashboardConvo && <VendorConvoView product={dashboardConvo} vendorAuth={vendorAuth} onClose={() => setDashboardConvo(null)} />}
      {showAddItem && <AddItemForm vendorAuth={vendorAuth} onClose={() => setShowAddItem(false)} onAdded={async () => { setShowAddItem(false); await onDataChanged(); }} />}
    </div>
  );
}

function AddItemForm({ vendorAuth, onClose, onAdded }) {
  const [name, setName] = useState("");
  const [category, setCategory] = useState(CATEGORIES[0]);
  const [price, setPrice] = useState("");
  const [icon, setIcon] = useState("🛍️");
  const [imageFile, setImageFile] = useState(null);
  const [desc, setDesc] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");

  async function submit() {
    if (!name.trim() || !price || Number(price) <= 0) { setError("Give the item a name and a price above 0."); return; }
    setSubmitting(true); setError("");
    try {
      let imageBase64;
      if (imageFile) imageBase64 = await fileToDataUrl(imageFile);
      await api("/api/products", { method: "POST", token: vendorAuth.token, body: { name, category, price: Number(price), icon, desc, imageBase64 } });
      onAdded();
    } catch (e) { setError(e.message); }
    setSubmitting(false);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
      <div className="absolute inset-0" style={{ background: "rgba(0,0,0,0.55)" }} onClick={onClose} />
      <div className="cm-fade-up relative w-full max-w-sm rounded-lg p-5 max-h-[90vh] overflow-y-auto cm-scrollbar" style={{ background: CARD_PAPER }}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="cm-display text-lg" style={{ color: "#2b2b2b" }}>List an item</h3>
          <button onClick={onClose} style={{ color: "#7a7a7a" }}>✕</button>
        </div>
        <div className="space-y-3">
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Item name</label>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Jollof rice (large)" className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "#d8cfb4" }} />
          </div>
          <div className="flex gap-2">
            <div className="flex-1">
              <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Category</label>
              <select value={category} onChange={(e) => setCategory(e.target.value)} className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "#d8cfb4" }}>
                {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="w-20">
              <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Emoji</label>
              <input value={icon} onChange={(e) => setIcon(e.target.value)} maxLength={4} className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1 text-center" style={{ borderColor: "#d8cfb4" }} />
            </div>
          </div>
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Photo (optional)</label>
            <input type="file" accept="image/*" onChange={(e) => setImageFile(e.target.files[0])} className="cm-body w-full text-xs mt-1" />
          </div>
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Price (₦)</label>
            <input type="number" min={1} value={price} onChange={(e) => setPrice(e.target.value)} placeholder="e.g. 1500" className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1" style={{ borderColor: "#d8cfb4" }} />
          </div>
          <div>
            <label className="cm-body text-xs font-medium" style={{ color: "#5a5a5a" }}>Description</label>
            <textarea value={desc} onChange={(e) => setDesc(e.target.value)} rows={2} className="cm-body w-full text-sm rounded-md px-3 py-2 border mt-1 resize-none" style={{ borderColor: "#d8cfb4" }} />
          </div>
        </div>
        {error && <p className="cm-body text-xs mt-2" style={{ color: CHALK_CORAL }}>{error}</p>}
        <button disabled={submitting} onClick={submit} className="cm-body w-full mt-4 text-sm font-semibold rounded-md py-2.5 disabled:opacity-40" style={{ background: "#20301f", color: CHALK_YELLOW }}>
          {submitting ? "Listing..." : "Add to the board"}
        </button>
      </div>
    </div>
  );
}

function VendorConvoView({ product, vendorAuth, onClose }) {
  const [buyers, setBuyers] = useState([]);
  const [selectedBuyer, setSelectedBuyer] = useState(null);
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState("");

  useEffect(() => {
    (async () => {
      try { const data = await api(`/api/messages/for-vendor/${product.id}`, { token: vendorAuth.token }); setBuyers(data.buyers || []); }
      catch { setBuyers([]); }
    })();
  }, [product.id]);

  async function loadConvo(buyerUsername) {
    setSelectedBuyer(buyerUsername);
    const data = await api(`/api/messages/${product.id}/${buyerUsername}`);
    setMessages(data.messages || []);
  }

  async function reply() {
    if (!draft.trim() || !selectedBuyer) return;
    const text = draft.trim();
    setDraft("");
    await api("/api/messages", { method: "POST", token: vendorAuth.token, body: { productId: product.id, buyerUsername: selectedBuyer, text } });
    await loadConvo(selectedBuyer);
  }

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center px-4">
      <div className="absolute inset-0" style={{ background: "rgba(0,0,0,0.55)" }} onClick={onClose} />
      <div className="cm-fade-up relative w-full max-w-md rounded-lg p-5 max-h-[80vh] flex flex-col" style={{ background: CARD_PAPER }}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="cm-body text-sm font-semibold" style={{ color: "#2b2b2b" }}>{product.icon || "🛍️"} {product.name} — chats</h3>
          <button onClick={onClose} style={{ color: "#7a7a7a" }}>✕</button>
        </div>
        {!selectedBuyer ? (
          buyers.length === 0 ? <p className="cm-body text-sm" style={{ color: "#7a7a7a" }}>No one has messaged about this item yet.</p>
            : (
              <div className="space-y-2 overflow-y-auto cm-scrollbar">
                {buyers.map((b) => (
                  <button key={b} onClick={() => loadConvo(b)} className="cm-body w-full text-left text-sm rounded-md px-3 py-2 border" style={{ borderColor: "#d8cfb4", color: "#2b2b2b" }}>{b}</button>
                ))}
              </div>
            )
        ) : (
          <>
            <button onClick={() => setSelectedBuyer(null)} className="cm-body text-xs mb-2" style={{ color: "#7a7a7a" }}>← back to buyers</button>
            <div className="flex-1 overflow-y-auto cm-scrollbar space-y-2 mb-2">
              {messages.map((m, i) => (
                <div key={i} className={`flex ${m.sender === "vendor" ? "justify-end" : "justify-start"}`}>
                  <div className="cm-body text-sm max-w-[78%] px-3 py-2 rounded-2xl" style={{ background: m.sender === "vendor" ? "#20301f" : "#EFE9D8", color: m.sender === "vendor" ? CHALK_YELLOW : "#2b2b2b" }}>{m.text}</div>
                </div>
              ))}
            </div>
            <div className="flex items-center gap-2">
              <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && reply()} placeholder="Reply..." className="cm-body flex-1 text-sm rounded-full px-3 py-2 border" style={{ borderColor: "#d8cfb4" }} />
              <button onClick={reply} className="p-2 rounded-full" style={{ background: "#20301f", color: CHALK_YELLOW }}>➤</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------------------------- Owner / Management ---------------------------- */
function OwnerArea({ vendorOf }) {
  const [ownerToken, setOwnerToken] = useState(() => localStorage.getItem("cm_owner_token"));
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit() {
    setBusy(true); setError("");
    try {
      const data = await api("/api/owner/login", { method: "POST", body: { password } });
      localStorage.setItem("cm_owner_token", data.token);
      setOwnerToken(data.token);
    } catch (e) { setError(e.message); }
    setBusy(false);
  }

  if (!ownerToken) {
    return (
      <div className="max-w-sm mx-auto px-5 pt-16 pb-24 text-center">
        <h2 className="cm-display text-2xl mb-1" style={{ color: CHALK }}>Management</h2>
        <p className="cm-body text-sm mb-4" style={{ color: "rgba(243,240,231,0.7)" }}>Enter the management password (first time sets it).</p>
        <input type="password" autoFocus value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder="Password" className="cm-body w-full text-sm rounded-md px-3 py-2 border mb-2" style={{ borderColor: "rgba(243,240,231,0.3)", background: "rgba(243,240,231,0.08)", color: CHALK }} />
        {error && <p className="cm-body text-xs mb-2" style={{ color: CHALK_CORAL }}>{error}</p>}
        <button disabled={busy} onClick={submit} className="cm-body w-full text-sm font-semibold rounded-md px-4 py-2.5 disabled:opacity-40" style={{ background: CHALK_YELLOW, color: "#20301f" }}>
          {busy ? "..." : "Continue"}
        </button>
      </div>
    );
  }
  return <OwnerDashboard ownerToken={ownerToken} vendorOf={vendorOf} onLogout={() => { localStorage.removeItem("cm_owner_token"); setOwnerToken(null); }} />;
}

function OwnerDashboard({ ownerToken, onLogout }) {
  const [orders, setOrders] = useState([]);
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("today");

  async function refresh() {
    setLoading(true);
    try {
      const data = await api("/api/owner/orders", { token: ownerToken });
      setOrders(data.orders || []);
      setStats(data.stats || null);
    } catch (e) { console.error(e); }
    setLoading(false);
  }
  useEffect(() => { refresh(); }, []);

  async function markDelivered(id) {
    await api(`/api/owner/orders/${id}/deliver`, { method: "PATCH", token: ownerToken });
    refresh();
  }

  const isToday = (ts) => new Date(ts).toDateString() === new Date().toDateString();
  const shown = filter === "today" ? orders.filter((o) => isToday(o.created_at)) : orders;

  return (
    <div className="max-w-5xl mx-auto px-5 pb-24 pt-10">
      <div className="cm-fade-up mb-6 flex items-start justify-between">
        <div>
          <p className="cm-hand text-2xl mb-1" style={{ color: CHALK_BLUE }}>management</p>
          <h2 className="cm-display text-3xl" style={{ color: CHALK }}>Today at a glance</h2>
        </div>
        <button onClick={onLogout} className="cm-body text-xs rounded-full px-3 py-1.5" style={{ background: "rgba(243,240,231,0.1)", color: CHALK }}>Log out</button>
      </div>

      {stats && (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
          <StatCard label="Orders today" value={stats.ordersToday} />
          <StatCard label="Delivered today" value={stats.deliveredToday} />
          <StatCard label="Revenue (delivered)" value={money(stats.revenueDeliveredToday)} />
          <StatCard label="Expected revenue today" value={money(stats.expectedRevenueToday)} sub={`${stats.pendingToday} still pending`} />
        </div>
      )}

      <div className="flex items-center justify-between mb-3">
        <h3 className="cm-body text-sm font-semibold" style={{ color: CHALK_YELLOW }}>📋 Orders</h3>
        <div className="flex rounded-full p-1" style={{ background: "rgba(243,240,231,0.08)" }}>
          <button onClick={() => setFilter("today")} className="cm-body text-xs px-3 py-1 rounded-full" style={{ background: filter === "today" ? CHALK_YELLOW : "transparent", color: filter === "today" ? "#20301f" : CHALK }}>Today</button>
          <button onClick={() => setFilter("all")} className="cm-body text-xs px-3 py-1 rounded-full" style={{ background: filter === "all" ? CHALK_YELLOW : "transparent", color: filter === "all" ? "#20301f" : CHALK }}>All time</button>
        </div>
      </div>

      {loading ? <p className="cm-body text-sm" style={{ color: "rgba(243,240,231,0.6)" }}>loading...</p>
        : shown.length === 0 ? <p className="cm-hand text-lg" style={{ color: "rgba(243,240,231,0.6)" }}>no orders here yet</p>
        : (
          <div className="space-y-3">
            {shown.slice().reverse().map((o) => (
              <div key={o.id} className="cm-card rounded-md p-4 flex items-start justify-between gap-3 flex-wrap">
                <div>
                  <p className="cm-body text-sm font-semibold" style={{ color: "#2b2b2b" }}>{o.qty}× {o.product_name} — {o.vendorName}</p>
                  <p className="cm-body text-xs mt-1" style={{ color: "#5a5a5a" }}>📍 {o.location} · 📞 {o.phone}</p>
                  <p className="cm-body text-xs mt-1" style={{ color: "#7a7a7a" }}>from {o.buyer_display_name} · {new Date(o.created_at).toLocaleString()} · pays {o.payment_method}</p>
                  {o.notes && <p className="cm-body text-xs mt-1 italic" style={{ color: "#7a7a7a" }}>"{o.notes}"</p>}
                </div>
                <div className="text-right">
                  <p className="cm-mono text-sm font-bold" style={{ color: "#2b2b2b" }}>{money(o.total)}</p>
                  <p className="cm-body text-[11px] mb-2" style={{ color: "#9a9a9a" }}>incl. {money(o.delivery_fee)} delivery</p>
                  {o.status === "delivered"
                    ? <span className="cm-body text-xs px-2 py-1 rounded-full" style={{ background: "#dff0d8", color: "#2b5a2b" }}>✓ Delivered</span>
                    : <button onClick={() => markDelivered(o.id)} className="cm-body text-xs font-semibold rounded-full px-3 py-1.5" style={{ background: "#20301f", color: CHALK_YELLOW }}>Mark delivered</button>}
                </div>
              </div>
            ))}
          </div>
        )}
    </div>
  );
}

function StatCard({ label, value, sub }) {
  return (
    <div className="cm-card rounded-md p-3">
      <span className="cm-body text-[11px]" style={{ color: "#7a7a7a" }}>{label}</span>
      <p className="cm-mono text-lg font-bold" style={{ color: "#2b2b2b" }}>{value}</p>
      {sub && <p className="cm-body text-[10px]" style={{ color: "#9a9a9a" }}>{sub}</p>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
