<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoveMart</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #1F3B31; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }
  .topbar { background: #213F34; border-bottom: 1px solid rgba(243,240,231,0.15); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .brand { color: #F0C846; font-weight: 800; font-size: 20px; }
  .tabs { display: flex; gap: 6px; background: rgba(243,240,231,0.08); border-radius: 999px; padding: 4px; }
  .tab-btn { border: none; background: transparent; color: #F3F0E7; padding: 7px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .tab-btn.active { background: #F0C846; color: #20301f; font-weight: 700; }
  .gear-btn { border: none; background: rgba(243,240,231,0.08); color: rgba(243,240,231,0.7); width: 34px; height: 34px; border-radius: 999px; cursor: pointer; font-size: 16px; }
  h1, h2, h3 { color: #F3F0E7; }
  .hero { text-align: center; padding: 30px 0 10px; }
  .hero .sub { color: #8FC1D4; font-size: 20px; margin-bottom: 4px; }
  .hero h2 { font-size: 26px; line-height: 1.3; margin: 0; }
  .hero h2 .accent { color: #E8735F; }
  .card { background: #FBF7EC; border-radius: 8px; padding: 16px; box-shadow: 0 6px 14px rgba(0,0,0,0.25); }
  .field { margin-bottom: 10px; text-align: left; }
  .field label { display: block; font-size: 12px; color: #5a5a5a; margin-bottom: 4px; }
  .light-label { color: rgba(243,240,231,0.65); }
  input, select, textarea { width: 100%; padding: 9px 11px; border-radius: 6px; border: 1px solid #d8cfb4; font-size: 14px; font-family: inherit; }
  .dark-input { background: rgba(243,240,231,0.08); border: 1px solid rgba(243,240,231,0.3); color: #F3F0E7; }
  .btn { border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; }
  .btn-primary { background: #20301f; color: #F0C846; }
  .btn-accent { background: #F0C846; color: #20301f; }
  .btn-ghost { background: rgba(243,240,231,0.1); color: #F3F0E7; }
  .btn-small { width: auto; padding: 6px 12px; font-size: 12px; }
  .msg-error { color: #E8735F; font-size: 13px; margin: 6px 0; }
  .msg-info { color: rgba(243,240,231,0.7); font-size: 14px; text-align: center; margin-bottom: 16px; }
  .center { text-align: center; }
  .searchbar { display: flex; align-items: center; gap: 8px; background: rgba(243,240,231,0.06); border: 2px dashed rgba(243,240,231,0.35); border-radius: 10px; padding: 10px 12px; margin: 20px 0 12px; }
  .searchbar input { border: none; background: transparent; color: #F3F0E7; outline: none; font-size: 15px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip { border: 1px solid rgba(243,240,231,0.25); background: transparent; color: #F3F0E7; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip.active { background: #F0C846; border-color: #F0C846; color: #20301f; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
  .product-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; background: #EFE9D8; }
  .product-card .icon { font-size: 28px; margin-bottom: 6px; }
  .product-card h3 { font-size: 15px; margin: 0 0 4px; color: #2b2b2b; }
  .product-card p { font-size: 12px; color: #5a5a5a; margin: 0 0 10px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .price { font-weight: 800; color: #2b2b2b; font-family: monospace; }
  .vendor-tag { font-size: 11px; background: #EFE9D8; color: #5a5a5a; padding: 2px 8px; border-radius: 999px; }
  .section-title { color: #F0C846; font-size: 14px; font-weight: 700; margin: 24px 0 10px; }
  .link-btn { background: none; border: none; color: rgba(243,240,231,0.55); font-size: 12px; cursor: pointer; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-backdrop.side { justify-content: flex-end; padding: 0; }
  .modal-card { background: #FBF7EC; border-radius: 8px; padding: 18px; max-width: 400px; width: 100%; max-height: 88vh; overflow-y: auto; }
  .side-panel { background: #FBF7EC; width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; }
  .chat-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e5ddc8; }
  .chat-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 16px; font-size: 14px; }
  .bubble.buyer { align-self: flex-end; background: #20301f; color: #F0C846; }
  .bubble.other { align-self: flex-start; background: #EFE9D8; color: #2b2b2b; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5ddc8; }
  .chat-input-row input { flex: 1; border-radius: 999px; }
  .icon-btn { border: none; background: #20301f; color: #F0C846; width: 40px; height: 40px; border-radius: 999px; cursor: pointer; flex-shrink: 0; }
  .stat-card { background: #FBF7EC; border-radius: 8px; padding: 12px; }
  .stat-label { font-size: 11px; color: #7a7a7a; }
  .stat-value { font-size: 18px; font-weight: 800; color: #2b2b2b; font-family: monospace; }
  .order-item { background: #FBF7EC; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  a { color: inherit; }
  .close-x { background: none; border: none; font-size: 18px; cursor: pointer; color: #7a7a7a; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ---------------- API base ---------------- */
function getApiBase() { return localStorage.getItem("cm_api_base") || ""; }
function setApiBase(v) { localStorage.setItem("cm_api_base", v); }

async function api(path, opts) {
  opts = opts || {};
  var headers = { "Content-Type": "application/json" };
  if (opts.token) headers["Authorization"] = "Bearer " + opts.token;
  var res = await fetch(getApiBase() + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
  return data;
}

function fileToDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function money(n) { return "\u20A6" + Number(n || 0).toLocaleString(); }
function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
var CATEGORIES = ["Snacks & Drinks", "Books & Notes", "Stationery & Printing", "Clothing", "Tech & Repairs", "Other"];
var DELIVERY_FEE = 500;

/* ---------------- Global state ---------------- */
var S = {
  role: "buyer",
  buyerAuth: null,
  vendorAuth: loadVendorAuth(),
  ownerToken: localStorage.getItem("cm_owner_token") || null,
  products: [],
  vendors: [],
  query: "",
  category: "All",
  activeProduct: null,
  vendorStage: "pick", // pick | auth | dashboard
  vendorSelected: null,
  vendorIsNew: false,
};

function loadBuyerAuth() {
  var t = localStorage.getItem("cm_buyer_token"), u = localStorage.getItem("cm_buyer_username"), d = localStorage.getItem("cm_buyer_displayname");
  return (t && u) ? { token: t, username: u, displayName: d } : null;
}
function saveBuyerAuth(a) {
  localStorage.setItem("cm_buyer_token", a.token);
  localStorage.setItem("cm_buyer_username", a.username);
  localStorage.setItem("cm_buyer_displayname", a.displayName);
  S.buyerAuth = a;
}
function clearBuyerAuth() {
  localStorage.removeItem("cm_buyer_token"); localStorage.removeItem("cm_buyer_username"); localStorage.removeItem("cm_buyer_displayname");
  S.buyerAuth = null;
}
function loadVendorAuth() {
  var t = localStorage.getItem("cm_vendor_token"), id = localStorage.getItem("cm_vendor_id"), n = localStorage.getItem("cm_vendor_name"), tag = localStorage.getItem("cm_vendor_tag");
  return (t && id) ? { token: t, id: id, name: n, tag: tag } : null;
}
function saveVendorAuth(a) {
  localStorage.setItem("cm_vendor_token", a.token);
  localStorage.setItem("cm_vendor_id", a.id);
  localStorage.setItem("cm_vendor_name", a.name);
  localStorage.setItem("cm_vendor_tag", a.tag || "");
  S.vendorAuth = a;
}
function clearVendorAuth() {
  localStorage.removeItem("cm_vendor_token"); localStorage.removeItem("cm_vendor_id"); localStorage.removeItem("cm_vendor_name"); localStorage.removeItem("cm_vendor_tag");
  S.vendorAuth = null;
}

var app = document.getElementById("app");
function render() { app.innerHTML = renderRoot(); }
function $(id) { return document.getElementById(id); }
function val(id) { var e = $(id); return e ? e.value : ""; }

async function refreshData() {
  try {
    var p = await api("/api/products");
    var v = await api("/api/vendors");
    S.products = p.products || [];
    S.vendors = v.vendors || [];
  } catch (e) { console.error("load failed", e); }
  render();
}

function vendorOf(id) {
  for (var i = 0; i < S.vendors.length; i++) if (S.vendors[i].id === id) return S.vendors[i];
  return { id: id, name: "Unknown seller", tag: "" };
}

/* ---------------- Root render ---------------- */
function renderRoot() {
  var html = topBar();
  if (S.role === "buyer") {
    html += S.buyerAuth ? buyerHome() : buyerGate();
  } else if (S.role === "vendor") {
    html += vendorArea();
  } else if (S.role === "profile") {
    html += profileView();
  } else {
    html += ownerArea();
  }
  if (S.activeProduct && S.buyerAuth) html += chatPanel();
  return html;
}

function topBar() {
  return (
    '<div class="topbar">' +
      '<div class="brand">\uD83C\uDFEB MoveMart</div>' +
      '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="tabs">' +
          '<button class="tab-btn ' + (S.role === "buyer" ? "active" : "") + '" onclick="setRole(\'buyer\')">' + (S.buyerAuth ? ("Hi, " + esc(S.buyerAuth.displayName.split(" ")[0])) : "I&#39;m shopping") + '</button>' +
          '<button class="tab-btn ' + (S.role === "vendor" ? "active" : "") + '" onclick="setRole(\'vendor\')">\uD83C\uDFEC I sell here</button>' +
        '</div>' +
        (S.buyerAuth ? '<button class="gear-btn" onclick="openProfile()" title="Profile">\uD83D\uDC64</button>' : '') +
      '</div>' +
    '</div>'
  );
}
function setRole(r) { S.role = r; if (r === "vendor" && S.vendorAuth) S.vendorStage = "dashboard"; render(); }

/* ================= BUYER ================= */
function buyerGate() {
  var st = S._gateStage || "form"; // form | verify
  var mode = S._gateMode || "login"; // login | signup

  if (st === "verify" && S._pendingSignup) {
    var p = S._pendingSignup;
    return (
      '<div class="wrap"><div style="max-width:360px;margin:0 auto;padding-top:40px;" class="center">' +
        '<h2>Check your email</h2>' +
        '<p class="msg-info">' + (p.emailSent ? "We emailed you a 6-digit code to confirm your account." : "No mail provider is configured on the backend yet, so here&#39;s the code directly:") + '</p>' +
        (p.emailSent ? "" : '<div style="background:rgba(240,200,70,0.12);border:1px dashed rgba(240,200,70,0.4);color:#F0C846;border-radius:6px;padding:10px;margin-bottom:14px;font-size:13px;">Demo mode &mdash; code: <strong>' + esc(p.devCode) + '</strong></div>') +
        '<div class="field"><input id="code-input" placeholder="6-digit code" inputmode="numeric" maxlength="6" style="text-align:center;letter-spacing:4px;" class="dark-input" /></div>' +
        (S._gateError ? '<p class="msg-error">' + esc(S._gateError) + '</p>' : "") +
        '<button class="btn btn-accent" onclick="submitVerify()">Verify & create account</button>' +
        '<div style="margin-top:10px;"><button class="link-btn" onclick="S._gateStage=\'form\';render();">&larr; back</button></div>' +
      '</div></div>'
    );
  }

  return (
    '<div class="wrap"><div style="max-width:360px;margin:0 auto;padding-top:36px;" class="center">' +
      '<h2>' + (mode === "login" ? "Log in to shop" : "Create your account") + '</h2>' +
      '<p class="msg-info">' + (mode === "login" ? "Enter your username and PIN." : "Pick a unique username &mdash; we&#39;ll email a code once to confirm it&#39;s you.") + '</p>' +
      '<div class="tabs" style="max-width:240px;margin:0 auto 16px;">' +
        '<button class="tab-btn ' + (mode === "login" ? "active" : "") + '" onclick="switchGateMode(\'login\')">Log in</button>' +
        '<button class="tab-btn ' + (mode === "signup" ? "active" : "") + '" onclick="switchGateMode(\'signup\')">Sign up</button>' +
      '</div>' +
      '<div style="text-align:left;">' +
        '<div class="field"><label class="light-label">Username</label><input id="g-username" class="dark-input" placeholder="e.g. tega_01" /></div>' +
        (mode === "signup" ? '<div class="field"><label class="light-label">Display name</label><input id="g-displayname" class="dark-input" placeholder="e.g. Tega" /></div>' : "") +
        (mode === "signup" ? '<div class="field"><label class="light-label">Email</label><input id="g-email" type="email" class="dark-input" placeholder="you@example.com" /></div>' : "") +
        '<div class="field"><label class="light-label">PIN</label><input id="g-pin" class="dark-input" inputmode="numeric" maxlength="6" placeholder="4-digit PIN" /></div>' +
        (mode === "signup" ? '<div class="field"><label class="light-label">Confirm PIN</label><input id="g-confirmpin" class="dark-input" inputmode="numeric" maxlength="6" placeholder="Re-enter PIN" /></div>' : "") +
      '</div>' +
      (S._gateError ? '<p class="msg-error">' + esc(S._gateError) + '</p>' : "") +
      '<button class="btn btn-accent" onclick="' + (mode === "login" ? "submitLogin()" : "submitSignup()") + '">' + (mode === "login" ? "Log in" : "Send confirmation code") + '</button>' +
    '</div></div>'
  );
}
function switchGateMode(m) { S._gateMode = m; S._gateError = ""; render(); }

async function submitSignup() {
  var body = { username: val("g-username"), displayName: val("g-displayname"), email: val("g-email"), pin: val("g-pin") };
  if (body.pin !== val("g-confirmpin")) { S._gateError = "PINs don't match."; render(); return; }
  try {
    var data = await api("/api/buyers/signup", { method: "POST", body: body });
    S._pendingSignup = { username: body.username, devCode: data.devCode, emailSent: data.emailSent };
    S._gateStage = "verify"; S._gateError = "";
    render();
  } catch (e) { S._gateError = e.message; render(); }
}
async function submitLogin() {
  try {
    var data = await api("/api/buyers/login", { method: "POST", body: { username: val("g-username"), pin: val("g-pin") } });
    saveBuyerAuth(data);
    S._gateStage = "form"; S._gateError = "";
    await refreshData();
  } catch (e) { S._gateError = e.message; render(); }
}
async function submitVerify() {
  try {
    var data = await api("/api/buyers/signup/verify", { method: "POST", body: { username: S._pendingSignup.username, code: val("code-input") } });
    saveBuyerAuth(data);
    S._gateStage = "form";
    await refreshData();
  } catch (e) { S._gateError = e.message; render(); }
}

function buyerHome() {
  var cats = ["All"].concat(CATEGORIES);
  var q = S.query.trim().toLowerCase();
  var filtered = S.products.filter(function (p) {
    var matchesCat = S.category === "All" || p.category === S.category;
    var matchesQ = q === "" || p.name.toLowerCase().indexOf(q) >= 0 || p.category.toLowerCase().indexOf(q) >= 0 || (p.desc || "").toLowerCase().indexOf(q) >= 0;
    return matchesCat && matchesQ;
  });
  var related = [];
  if (q && filtered.length === 0) {
    related = S.products.filter(function (p) {
      return p.name.toLowerCase().split(" ").some(function (w) { return q.indexOf(w) >= 0 || w.indexOf(q) >= 0; });
    }).slice(0, 4);
  }

  var html = '<div class="wrap">';
  html += '<div class="hero"><div class="sub">psst &mdash; need something on campus?</div><h2>Search it. Chat the seller. <span class="accent">Get it delivered.</span></h2>';
  html += '<div style="margin-top:8px;"><button class="link-btn" onclick="switchBuyer()">&#8617; not ' + esc(S.buyerAuth.displayName) + '? switch</button></div></div>';

  html += '<div class="searchbar">\uD83D\uDD0D <input id="search-input" value="' + esc(S.query) + '" placeholder="Search for snacks, textbooks, printing, repairs..." oninput="onSearchInput(this.value)" /></div>';

  html += '<div class="chips">';
  cats.forEach(function (c) {
    html += '<button class="chip ' + (S.category === c ? "active" : "") + '" onclick="setCategory(\'' + esc(c).replace(/'/g, "\\'") + '\')">' + esc(c) + '</button>';
  });
  html += '</div>';

  if (S.products.length === 0) {
    html += '<p class="msg-info">loading the board...</p>';
  } else if (filtered.length === 0) {
    html += '<p class="msg-info" style="font-size:18px;">nothing matches "' + esc(S.query) + '" yet</p>';
    if (related.length) { html += '<div class="section-title">you might mean:</div>' + productGrid(related); }
  } else {
    html += '<div class="section-title">All listings</div>' + productGrid(filtered);
  }
  html += '</div>';
  return html;
}
function onSearchInput(v) { S.query = v; renderKeepFocus("search-input"); }
function setCategory(c) { S.category = c; render(); }
function switchBuyer() {
  clearBuyerAuth();
  S._gateStage = "form"; S._gateMode = "login"; S._gateError = "";
  S._pendingSignup = null; S.activeProduct = null;
  render();
}

function openProfile() {
  S.role = "profile"; S._profile = null; S._profileOrders = []; S._profileError = ""; S._profileMsg = "";
  render();
  loadProfile();
}
async function loadProfile() {
  try {
    var me = await api("/api/buyers/me", { token: S.buyerAuth.token });
    var mine = await api("/api/orders/mine", { token: S.buyerAuth.token });
    S._profile = me;
    S._profileOrders = mine.orders || [];
  } catch (e) { S._profileError = e.message; }
  render();
}
function profileView() {
  if (!S.buyerAuth) return '<div class="wrap center" style="padding-top:60px;">Log in to view your profile.</div>';
  var p = S._profile;
  var html = '<div class="wrap" style="max-width:480px;margin:0 auto;padding-top:28px;padding-bottom:60px;">';
  html += '<button class="link-btn" onclick="setRole(\'buyer\')" style="margin-bottom:14px;">&larr; back to shopping</button>';
  html += '<h2 style="margin-bottom:16px;">Your profile</h2>';

  if (!p) {
    html += '<p class="msg-info">Loading...</p></div>';
    return html;
  }

  var avatar = p.avatarUrl
    ? '<img src="' + esc(p.avatarUrl) + '" style="width:72px;height:72px;border-radius:50%;object-fit:cover;" />'
    : '<div style="width:72px;height:72px;border-radius:50%;background:rgba(243,240,231,0.12);display:flex;align-items:center;justify-content:center;font-size:28px;">\uD83D\uDC64</div>';

  html += '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">' + avatar +
    '<div><input id="pf-photo" type="file" accept="image/*" onchange="uploadAvatar()" /></div></div>';

  html += '<div class="field"><label class="light-label">Username</label><input class="dark-input" value="' + esc(p.username) + '" disabled /></div>';
  html += '<div class="field"><label class="light-label">Display name</label><input id="pf-displayname" class="dark-input" value="' + esc(p.displayName) + '" /></div>';
  html += '<button class="btn btn-accent" onclick="saveProfileName()" style="margin-bottom:24px;">Save name</button>';

  html += '<h3 style="margin-bottom:8px;">Change PIN</h3>';
  html += '<div class="field"><label class="light-label">Current PIN</label><input id="pf-currentpin" class="dark-input" inputmode="numeric" maxlength="6" /></div>';
  html += '<div class="field"><label class="light-label">New PIN</label><input id="pf-newpin" class="dark-input" inputmode="numeric" maxlength="6" /></div>';
  html += '<button class="btn btn-accent" onclick="changePin()" style="margin-bottom:10px;">Update PIN</button>';

  if (S._profileError) html += '<p class="msg-error">' + esc(S._profileError) + '</p>';
  if (S._profileMsg) html += '<p class="msg-info">' + esc(S._profileMsg) + '</p>';

  html += '<h3 style="margin:24px 0 8px;">Order history</h3>';
  if (S._profileOrders.length === 0) {
    html += '<p class="msg-info">No orders yet.</p>';
  } else {
    S._profileOrders.forEach(function (o) {
      html += '<div class="card" style="padding:12px;margin-bottom:8px;">' +
        '<div style="font-weight:600;">' + o.qty + '\u00d7 ' + esc(o.product_name) + '</div>' +
        '<div style="font-size:13px;opacity:0.7;">' + money(o.agreed_price * o.qty + o.delivery_fee) + ' &middot; ' + esc(o.status) + ' &middot; ' + new Date(o.created_at).toLocaleDateString() + '</div>' +
      '</div>';
    });
  }

  html += '</div>';
  return html;
}
async function uploadAvatar() {
  var input = $("pf-photo");
  if (!input.files || !input.files[0]) return;
  try {
    var dataUrl = await fileToDataUrl(input.files[0]);
    var data = await api("/api/buyers/me", { method: "PATCH", token: S.buyerAuth.token, body: { avatarBase64: dataUrl } });
    S._profile = data; S._profileMsg = "Photo updated."; S._profileError = "";
  } catch (e) { S._profileError = e.message; }
  render();
}
async function saveProfileName() {
  try {
    var data = await api("/api/buyers/me", { method: "PATCH", token: S.buyerAuth.token, body: { displayName: val("pf-displayname") } });
    S._profile = data; S.buyerAuth.displayName = data.displayName; saveBuyerAuth(S.buyerAuth);
    S._profileMsg = "Name updated."; S._profileError = "";
  } catch (e) { S._profileError = e.message; S._profileMsg = ""; }
  render();
}
async function changePin() {
  try {
    await api("/api/buyers/me", { method: "PATCH", token: S.buyerAuth.token, body: { currentPin: val("pf-currentpin"), newPin: val("pf-newpin") } });
    S._profileMsg = "PIN updated."; S._profileError = "";
  } catch (e) { S._profileError = e.message; S._profileMsg = ""; }
  render();
}

function renderKeepFocus(inputId) {
  var el = $(inputId);
  var pos = el ? el.selectionStart : null;
  render();
  var el2 = $(inputId);
  if (el2) { el2.focus(); if (pos != null) el2.setSelectionRange(pos, pos); }
}

function productGrid(list) {
  var html = '<div class="grid">';
  list.forEach(function (p) {
    var v = vendorOf(p.vendorId);
    html += '<div class="card product-card">';
    if (p.imageUrl) html += '<img src="' + esc(getApiBase() + p.imageUrl) + '" onerror="this.style.display=\'none\'" />';
    else html += '<div class="icon">' + (p.icon || "\uD83D\uDED2") + '</div>';
    html += '<h3>' + esc(p.name) + '</h3><p>' + esc(p.desc || "") + '</p>';
    html += '<div class="row-between"><span class="price">' + money(p.price) + '</span><span class="vendor-tag">' + esc(v.name) + '</span></div>';
    html += '<button class="btn btn-primary" onclick="openChat(\'' + esc(p.id) + '\')">\uD83D\uDCAC Chat with seller</button>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function openChat(productId) {
  var p = S.products.filter(function (x) { return x.id === productId; })[0];
  if (!p) return;
  S.activeProduct = p;
  S._chatMessages = [];
  S._chatLoading = true;
  S._showOrderForm = false;
  S._orderSent = false;
  render();
  loadChatMessages();
}
function closeChat() { S.activeProduct = null; render(); }

async function loadChatMessages() {
  try {
    var data = await api("/api/messages/" + S.activeProduct.id + "/" + S.buyerAuth.username);
    S._chatMessages = data.messages || [];
  } catch (e) { console.error(e); }
  S._chatLoading = false;
  render();
}
async function sendChatMessage() {
  var text = val("chat-draft").trim();
  if (!text) return;
  $("chat-draft").value = "";
  try {
    await api("/api/messages", { method: "POST", token: S.buyerAuth.token, body: { productId: S.activeProduct.id, text: text } });
    await loadChatMessages();
  } catch (e) { alert(e.message); }
}

function chatPanel() {
  var p = S.activeProduct, v = vendorOf(p.vendorId);
  var html = '<div class="modal-backdrop side" onclick="if(event.target===this)closeChat()"><div class="side-panel">';
  html += '<div class="chat-header"><button class="close-x" onclick="closeChat()">&larr;</button>';
  if (p.imageUrl) html += '<img src="' + esc(getApiBase() + p.imageUrl) + '" style="width:36px;height:36px;border-radius:6px;object-fit:cover;" />';
  else html += '<span style="font-size:22px;">' + (p.icon || "\uD83D\uDED2") + '</span>';
  html += '<div style="flex:1;"><div style="font-weight:700;font-size:14px;color:#2b2b2b;">' + esc(p.name) + '</div><div style="font-size:12px;color:#7a7a7a;">' + esc(v.name) + ' &middot; ' + esc(v.tag) + '</div></div>';
  html += '<button class="close-x" onclick="closeChat()">\u2715</button></div>';

  html += '<div class="chat-body">';
  html += '<div class="msg-info" style="background:#EFE9D8;padding:8px 12px;border-radius:8px;margin:0 auto;max-width:85%;">Chatting about <strong>' + esc(p.name) + '</strong> (' + money(p.price) + '). Agree a price here, then send the order below.</div>';
  if (S._chatLoading) { html += '<p class="msg-info">loading...</p>'; }
  else if (S._chatMessages.length === 0) { html += '<p class="msg-info" style="font-size:18px;">say hi to get things moving \uD83D\uDC4B</p>'; }
  else {
    S._chatMessages.forEach(function (m) {
      html += '<div class="bubble ' + (m.sender === "buyer" ? "buyer" : "other") + '">' + esc(m.text) + '</div>';
    });
  }
  html += '</div>';

  html += '<div class="chat-input-row"><input id="chat-draft" placeholder="Type a message..." onkeydown="if(event.key===\'Enter\')sendChatMessage()" /><button class="icon-btn" onclick="sendChatMessage()">&#10148;</button></div>';

  html += '<div style="padding:14px;">';
  if (S._orderSent) {
    html += '<div style="background:#dff0d8;color:#2b5a2b;border-radius:8px;padding:10px;font-size:14px;">\u2713 Order sent &mdash; ' + esc(v.name) + ' and management have it. Delivery fee is ' + money(DELIVERY_FEE) + ', payable by transfer or cash.</div>';
  } else {
    html += '<button class="btn btn-accent" onclick="S._showOrderForm=true;render();">\uD83D\uDCE6 Ready to order &mdash; send delivery details</button>';
  }
  html += '</div></div></div>';

  if (S._showOrderForm) html += orderFormModal();
  return html;
}

function orderFormModal() {
  var p = S.activeProduct, v = vendorOf(p.vendorId);
  var qty = S._orderQty || 1, priceVal = S._orderPrice != null ? S._orderPrice : p.price, pm = S._orderPayment || "transfer";
  var total = (Number(priceVal) || 0) * qty + DELIVERY_FEE;
  var html = '<div class="modal-backdrop" onclick="if(event.target===this)S._showOrderForm=false,render();"><div class="modal-card">';
  html += '<div class="row-between"><h3 style="margin:0;">Delivery details</h3><button class="close-x" onclick="S._showOrderForm=false;render();">\u2715</button></div>';
  html += '<p style="font-size:12px;color:#7a7a7a;">' + (p.icon || "\uD83D\uDED2") + ' ' + esc(p.name) + ' &mdash; from ' + esc(v.name) + '</p>';

  html += '<div style="display:flex;gap:8px;">';
  html += '<div class="field" style="flex:1;"><label>Quantity</label><input id="ord-qty" type="number" min="1" value="' + qty + '" oninput="S._orderQty=Math.max(1,+this.value);renderKeepValues();" /></div>';
  html += '<div class="field" style="flex:1;"><label>Price agreed (\u20A6/item)</label><input id="ord-price" type="number" min="1" value="' + esc(priceVal) + '" oninput="S._orderPrice=this.value;renderKeepValues();" /></div>';
  html += '</div>';
  html += '<div class="field"><label>Delivery location</label><input id="ord-location" placeholder="e.g. Hostel B, Room 214" value="' + esc(S._orderLocation || "") + '" oninput="S._orderLocation=this.value" /></div>';
  html += '<div class="field"><label>Phone number</label><input id="ord-phone" placeholder="e.g. 080..." value="' + esc(S._orderPhone || "") + '" oninput="S._orderPhone=this.value" /></div>';
  html += '<div class="field"><label>Payment method</label><div style="display:flex;gap:8px;">';
  ["transfer", "cash"].forEach(function (m) {
    var active = pm === m;
    html += '<button type="button" onclick="S._orderPayment=\'' + m + '\';render();" style="flex:1;padding:8px;border-radius:6px;border:1px solid ' + (active ? "#20301f" : "#d8cfb4") + ';background:' + (active ? "#20301f" : "transparent") + ';color:' + (active ? "#F0C846" : "#5a5a5a") + ';text-transform:capitalize;cursor:pointer;">' + m + '</button>';
  });
  html += '</div></div>';
  html += '<div class="field"><label>Notes (optional)</label><textarea id="ord-notes" rows="2" oninput="S._orderNotes=this.value">' + esc(S._orderNotes || "") + '</textarea></div>';

  html += '<div style="background:#EFE9D8;border-radius:6px;padding:10px;font-size:13px;color:#5a5a5a;">';
  html += '<div class="row-between" style="margin:0;"><span>' + qty + ' &times; ' + money(priceVal) + '</span><span>' + money((Number(priceVal) || 0) * qty) + '</span></div>';
  html += '<div class="row-between" style="margin:4px 0;"><span>Delivery fee</span><span>' + money(DELIVERY_FEE) + '</span></div>';
  html += '<div class="row-between" style="margin:0;font-weight:800;color:#2b2b2b;border-top:1px solid #d8cfb4;padding-top:6px;"><span>Total (' + pm + ')</span><span>' + money(total) + '</span></div>';
  html += '</div>';

  if (S._orderError) html += '<p class="msg-error">' + esc(S._orderError) + '</p>';
  html += '<div style="margin-top:12px;"><button class="btn btn-primary" onclick="submitOrder()">Send order</button></div>';
  html += '</div></div>';
  return html;
}
function renderKeepValues() {
  // qty/price use oninput handlers updating state directly; re-render not required for those two,
  // but totals need refresh - do a light targeted update instead of full render to avoid losing focus.
  var p = S.activeProduct;
  var qty = S._orderQty || 1, priceVal = S._orderPrice != null ? S._orderPrice : p.price;
  var total = (Number(priceVal) || 0) * qty + DELIVERY_FEE;
  var totalsEl = document.querySelector(".modal-card > div[style*='background:#EFE9D8']");
  if (totalsEl) {
    totalsEl.innerHTML =
      '<div class="row-between" style="margin:0;"><span>' + qty + ' &times; ' + money(priceVal) + '</span><span>' + money((Number(priceVal) || 0) * qty) + '</span></div>' +
      '<div class="row-between" style="margin:4px 0;"><span>Delivery fee</span><span>' + money(DELIVERY_FEE) + '</span></div>' +
      '<div class="row-between" style="margin:0;font-weight:800;color:#2b2b2b;border-top:1px solid #d8cfb4;padding-top:6px;"><span>Total (' + (S._orderPayment || "transfer") + ')</span><span>' + money(total) + '</span></div>';
  }
}
async function submitOrder() {
  var p = S.activeProduct;
  var body = {
    productId: p.id,
    qty: S._orderQty || 1,
    agreedPrice: Number(S._orderPrice != null ? S._orderPrice : p.price),
    paymentMethod: S._orderPayment || "transfer",
    location: val("ord-location"),
    phone: val("ord-phone"),
    notes: val("ord-notes"),
  };
  if (!body.location.trim() || !body.phone.trim() || !body.agreedPrice) { S._orderError = "Fill in location, phone, and a valid price."; render(); return; }
  try {
    await api("/api/orders", { method: "POST", token: S.buyerAuth.token, body: body });
    S._showOrderForm = false; S._orderSent = true; S._orderError = "";
    render();
  } catch (e) { S._orderError = e.message; render(); }
}

/* ================= VENDOR ================= */
function vendorArea() {
  if (S.vendorAuth && S.vendorStage !== "dashboard") S.vendorStage = "dashboard";
  if (S.vendorStage === "pick") return vendorPick();
  if (S.vendorStage === "auth") return vendorAuthScreen();
  return vendorDashboard();
}

function vendorPick() {
  var html = '<div class="wrap"><div class="hero"><div class="sub">seller check-in</div><h2>Who&#39;s setting up shop?</h2></div>';
  html += '<div class="grid">';
  S.vendors.forEach(function (v) {
    html += '<button class="card" style="text-align:left;cursor:pointer;" onclick="pickVendor(\'' + esc(v.id) + '\')"><div style="font-weight:700;font-size:14px;color:#2b2b2b;">' + esc(v.name) + '</div><div style="font-size:12px;color:#7a7a7a;">' + esc(v.tag) + '</div></button>';
  });
  html += '</div>';
  html += '<div class="card" style="margin-top:16px;"><div style="font-weight:700;font-size:14px;color:#2b2b2b;margin-bottom:8px;">+ Register a new shop</div>';
  html += '<div class="field"><input id="nv-name" placeholder="Shop name" /></div>';
  html += '<div class="field"><input id="nv-tag" placeholder="Where to find you" /></div>';
  html += '<div class="field"><input id="nv-pass" type="password" placeholder="Set a shop password" /></div>';
  if (S._vendorError) html += '<p class="msg-error">' + esc(S._vendorError) + '</p>';
  html += '<button class="btn btn-primary btn-small" onclick="registerVendor()">Continue</button></div></div>';
  return html;
}
function pickVendor(id) { S.vendorSelected = vendorOf(id); S.vendorIsNew = false; S._vendorError = ""; S.vendorStage = "auth"; render(); }
async function registerVendor() {
  var body = { name: val("nv-name"), tag: val("nv-tag"), password: val("nv-pass") };
  try {
    var data = await api("/api/vendors/register", { method: "POST", body: body });
    saveVendorAuth({ token: data.token, id: data.id, name: data.name, tag: data.tag });
    await refreshData();
    S.vendorStage = "dashboard"; render();
  } catch (e) { S._vendorError = e.message; render(); }
}
function vendorAuthScreen() {
  var v = S.vendorSelected;
  var html = '<div class="wrap"><div style="max-width:340px;margin:0 auto;padding-top:40px;" class="center">';
  html += '<h2>' + esc(v.name) + '</h2><p class="msg-info">Enter your shop&#39;s password to continue.</p>';
  html += '<div class="field"><input id="va-pass" type="password" class="dark-input" placeholder="Password" onkeydown="if(event.key===\'Enter\')loginVendor()" /></div>';
  if (S._vendorError) html += '<p class="msg-error">' + esc(S._vendorError) + '</p>';
  html += '<div style="display:flex;gap:8px;"><button class="btn btn-ghost" onclick="S.vendorStage=\'pick\';render();">Back</button><button class="btn btn-accent" onclick="loginVendor()">Unlock</button></div>';
  html += '</div></div>';
  return html;
}
async function loginVendor() {
  try {
    var data = await api("/api/vendors/login", { method: "POST", body: { id: S.vendorSelected.id, password: val("va-pass") } });
    saveVendorAuth({ token: data.token, id: data.id, name: data.name, tag: data.tag });
    S.vendorStage = "dashboard"; render();
  } catch (e) { S._vendorError = e.message; render(); }
}
function switchShop() { clearVendorAuth(); S.vendorStage = "pick"; render(); }

function vendorDashboard() {
  var myProducts = S.products.filter(function (p) { return p.vendorId === S.vendorAuth.id; });
  var html = '<div class="wrap">';
  html += '<div class="row-between" style="align-items:flex-start;padding-top:20px;">';
  html += '<div><div class="sub" style="color:#8FC1D4;">seller view</div><h2 style="margin:2px 0;">' + esc(S.vendorAuth.name) + '&#39;s counter</h2><div style="color:rgba(243,240,231,0.7);font-size:14px;">' + esc(S.vendorAuth.tag) + '</div></div>';
  html += '<button class="btn btn-ghost btn-small" onclick="switchShop()">Switch shop</button></div>';

  html += '<div class="row-between"><div class="section-title" style="margin:20px 0 0;">\uD83D\uDCE6 Your listings</div><button class="btn btn-accent btn-small" onclick="S._showAddItem=true;render();">+ List an item</button></div>';
  if (myProducts.length === 0) { html += '<p class="msg-info">nothing listed yet</p>'; }
  else {
    html += '<div class="grid">';
    myProducts.forEach(function (p) {
      html += '<div class="card">';
      if (p.imageUrl) html += '<img src="' + esc(getApiBase() + p.imageUrl) + '" style="width:100%;height:70px;object-fit:cover;border-radius:4px;margin-bottom:6px;" />';
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="font-size:20px;">' + (p.icon || "\uD83D\uDED2") + '</span><span style="font-weight:700;font-size:14px;color:#2b2b2b;">' + esc(p.name) + '</span></div>';
      html += '<div class="price" style="font-size:12px;margin-bottom:8px;">' + money(p.price) + '</div>';
      html += '<button class="btn btn-ghost btn-small" style="width:100%;background:#EFE9D8;color:#2b2b2b;" onclick="openVendorConvo(\'' + esc(p.id) + '\')">\uD83D\uDCAC View chats</button>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += '<div class="section-title">\uD83D\uDCCB Orders sent to you</div>';
  html += '<div id="vendor-orders-slot">loading...</div>';

  html += '</div>';
  if (S._showAddItem) html += addItemModal();
  if (S._vendorConvoProduct) html += vendorConvoModal();
  loadVendorOrders();
  return html;
}
async function loadVendorOrders() {
  try {
    var data = await api("/api/orders/vendor", { token: S.vendorAuth.token });
    var slot = $("vendor-orders-slot");
    if (!slot) return;
    var orders = data.orders || [];
    if (orders.length === 0) { slot.innerHTML = '<p class="msg-info">no orders yet</p>'; return; }
    var html = '';
    orders.slice().reverse().forEach(function (o) {
      html += '<div class="order-item"><div style="font-weight:700;font-size:14px;color:#2b2b2b;">' + o.qty + '\u00d7 ' + esc(o.product_name) + ' @ ' + money(o.agreed_price) + '</div>';
      html += '<div style="font-size:12px;color:#5a5a5a;">\uD83D\uDCCD ' + esc(o.location) + '</div>';
      html += '<div style="font-size:12px;color:#5a5a5a;">\uD83D\uDCDE ' + esc(o.phone) + ' &middot; from ' + esc(o.buyer_display_name) + '</div>';
      html += '<div style="font-size:12px;color:#7a7a7a;">' + (o.payment_method === "cash" ? "Pays cash on delivery" : "Pays by transfer") + '</div>';
      if (o.notes) html += '<div style="font-size:12px;color:#7a7a7a;font-style:italic;">"' + esc(o.notes) + '"</div>';
      html += '</div>';
    });
    slot.innerHTML = html;
  } catch (e) { console.error(e); }
}

function addItemModal() {
  var html = '<div class="modal-backdrop" onclick="if(event.target===this)S._showAddItem=false,render();"><div class="modal-card">';
  html += '<div class="row-between"><h3 style="margin:0;">List an item</h3><button class="close-x" onclick="S._showAddItem=false;render();">\u2715</button></div>';
  html += '<div class="field"><label>Item name</label><input id="ai-name" placeholder="e.g. Jollof rice (large)" /></div>';
  html += '<div style="display:flex;gap:8px;"><div class="field" style="flex:1;"><label>Category</label><select id="ai-category">';
  CATEGORIES.forEach(function (c) { html += '<option value="' + esc(c) + '">' + esc(c) + '</option>'; });
  html += '</select></div><div class="field" style="width:70px;"><label>Emoji</label><input id="ai-icon" maxlength="4" value="\uD83D\uDED2" style="text-align:center;" /></div></div>';
  html += '<div class="field"><label>Photo (optional)</label><input id="ai-image" type="file" accept="image/*" /></div>';
  html += '<div class="field"><label>Price (\u20A6)</label><input id="ai-price" type="number" min="1" placeholder="e.g. 1500" /></div>';
  html += '<div class="field"><label>Description</label><textarea id="ai-desc" rows="2"></textarea></div>';
  if (S._addItemError) html += '<p class="msg-error">' + esc(S._addItemError) + '</p>';
  html += '<button class="btn btn-primary" onclick="submitAddItem()">Add to the board</button>';
  html += '</div></div>';
  return html;
}
async function submitAddItem() {
  var name = val("ai-name"), price = val("ai-price");
  if (!name.trim() || !price || Number(price) <= 0) { S._addItemError = "Give the item a name and a price above 0."; render(); return; }
  var body = { name: name, category: val("ai-category"), price: Number(price), icon: val("ai-icon"), desc: val("ai-desc") };
  try {
    var fileInput = $("ai-image");
    if (fileInput && fileInput.files && fileInput.files[0]) body.imageBase64 = await fileToDataUrl(fileInput.files[0]);
    await api("/api/products", { method: "POST", token: S.vendorAuth.token, body: body });
    S._showAddItem = false; S._addItemError = "";
    await refreshData();
  } catch (e) { S._addItemError = e.message; render(); }
}

function openVendorConvo(productId) {
  S._vendorConvoProduct = S.products.filter(function (p) { return p.id === productId; })[0];
  S._vendorConvoBuyers = null;
  S._vendorConvoSelected = null;
  S._vendorConvoMessages = [];
  render();
  loadVendorConvoBuyers();
}
async function loadVendorConvoBuyers() {
  try {
    var data = await api("/api/messages/for-vendor/" + S._vendorConvoProduct.id, { token: S.vendorAuth.token });
    S._vendorConvoBuyers = data.buyers || [];
  } catch (e) { S._vendorConvoBuyers = []; }
  render();
}
async function selectVendorConvo(buyerUsername) {
  S._vendorConvoSelected = buyerUsername;
  render();
  var data = await api("/api/messages/" + S._vendorConvoProduct.id + "/" + buyerUsername);
  S._vendorConvoMessages = data.messages || [];
  render();
}
async function vendorConvoReply() {
  var text = val("vc-draft").trim();
  if (!text || !S._vendorConvoSelected) return;
  $("vc-draft").value = "";
  await api("/api/messages", { method: "POST", token: S.vendorAuth.token, body: { productId: S._vendorConvoProduct.id, buyerUsername: S._vendorConvoSelected, text: text } });
  var data = await api("/api/messages/" + S._vendorConvoProduct.id + "/" + S._vendorConvoSelected);
  S._vendorConvoMessages = data.messages || [];
  render();
}
function closeVendorConvo() { S._vendorConvoProduct = null; render(); }

function vendorConvoModal() {
  var p = S._vendorConvoProduct;
  var html = '<div class="modal-backdrop" onclick="if(event.target===this)closeVendorConvo()"><div class="modal-card" style="max-height:80vh;display:flex;flex-direction:column;">';
  html += '<div class="row-between"><h3 style="margin:0;font-size:15px;">' + (p.icon || "\uD83D\uDED2") + ' ' + esc(p.name) + ' &mdash; chats</h3><button class="close-x" onclick="closeVendorConvo()">\u2715</button></div>';

  if (!S._vendorConvoSelected) {
    if (S._vendorConvoBuyers === null) html += '<p class="msg-info">loading...</p>';
    else if (S._vendorConvoBuyers.length === 0) html += '<p style="font-size:14px;color:#7a7a7a;">No one has messaged about this item yet.</p>';
    else {
      S._vendorConvoBuyers.forEach(function (b) {
        html += '<button class="card" style="text-align:left;margin-bottom:6px;cursor:pointer;padding:10px;" onclick="selectVendorConvo(\'' + esc(b) + '\')">' + esc(b) + '</button>';
      });
    }
  } else {
    html += '<button class="link-btn" style="text-align:left;margin-bottom:8px;" onclick="S._vendorConvoSelected=null;render();">&larr; back to buyers</button>';
    html += '<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">';
    S._vendorConvoMessages.forEach(function (m) {
      html += '<div class="bubble ' + (m.sender === "vendor" ? "buyer" : "other") + '">' + esc(m.text) + '</div>';
    });
    html += '</div>';
    html += '<div style="display:flex;gap:8px;"><input id="vc-draft" placeholder="Reply..." onkeydown="if(event.key===\'Enter\')vendorConvoReply()" style="flex:1;border-radius:999px;" /><button class="icon-btn" onclick="vendorConvoReply()">&#10148;</button></div>';
  }
  html += '</div></div>';
  return html;
}

/* ================= OWNER ================= */
function ownerArea() {
  if (!S.ownerToken) return ownerLogin();
  return ownerDashboard();
}
function ownerLogin() {
  var html = '<div class="wrap"><div style="max-width:340px;margin:0 auto;padding-top:40px;" class="center">';
  html += '<h2>Management</h2><p class="msg-info">Enter the management password (first time sets it).</p>';
  html += '<div class="field"><input id="ow-pass" type="password" class="dark-input" placeholder="Password" onkeydown="if(event.key===\'Enter\')ownerSubmit()" /></div>';
  if (S._ownerError) html += '<p class="msg-error">' + esc(S._ownerError) + '</p>';
  html += '<button class="btn btn-accent" onclick="ownerSubmit()">Continue</button></div></div>';
  return html;
}
async function ownerSubmit() {
  try {
    var data = await api("/api/owner/login", { method: "POST", body: { password: val("ow-pass") } });
    localStorage.setItem("cm_owner_token", data.token);
    S.ownerToken = data.token; S._ownerError = "";
    render();
  } catch (e) { S._ownerError = e.message; render(); }
}
function ownerLogout() { localStorage.removeItem("cm_owner_token"); S.ownerToken = null; render(); }

function ownerDashboard() {
  var html = '<div class="wrap">';
  html += '<div class="row-between" style="padding-top:20px;"><div><div class="sub" style="color:#8FC1D4;">management</div><h2 style="margin:2px 0;">Today at a glance</h2></div><button class="btn btn-ghost btn-small" onclick="ownerLogout()">Log out</button></div>';
  html += '<div id="owner-stats-slot" class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px;"><p class="msg-info">loading...</p></div>';
  html += '<div class="row-between"><div class="section-title" style="margin:10px 0;">\uD83D\uDCCB Orders</div>';
  html += '<div class="tabs"><button class="tab-btn ' + ((S._ownerFilter || "today") === "today" ? "active" : "") + '" onclick="S._ownerFilter=\'today\';loadOwnerData();">Today</button><button class="tab-btn ' + (S._ownerFilter === "all" ? "active" : "") + '" onclick="S._ownerFilter=\'all\';loadOwnerData();">All time</button></div></div>';
  html += '<div id="owner-orders-slot"><p class="msg-info">loading...</p></div>';
  html += '</div>';
  loadOwnerData();
  return html;
}
async function loadOwnerData() {
  try {
    var data = await api("/api/owner/orders", { token: S.ownerToken });
    var statsSlot = $("owner-stats-slot"), ordersSlot = $("owner-orders-slot");
    if (!statsSlot) return;
    var st = data.stats;
    statsSlot.innerHTML =
      statCard("Orders today", st.ordersToday) +
      statCard("Delivered today", st.deliveredToday) +
      statCard("Revenue (delivered)", money(st.revenueDeliveredToday)) +
      statCard("Expected revenue today", money(st.expectedRevenueToday), st.pendingToday + " still pending");

    var filter = S._ownerFilter || "today";
    var isToday = function (ts) { return new Date(ts).toDateString() === new Date().toDateString(); };
    var orders = data.orders || [];
    var shown = filter === "today" ? orders.filter(function (o) { return isToday(o.created_at); }) : orders;
    if (!ordersSlot) return;
    if (shown.length === 0) { ordersSlot.innerHTML = '<p class="msg-info">no orders here yet</p>'; return; }
    var html = "";
    shown.slice().reverse().forEach(function (o) {
      html += '<div class="order-item">';
      html += '<div style="font-weight:700;font-size:14px;color:#2b2b2b;">' + o.qty + '\u00d7 ' + esc(o.product_name) + ' &mdash; ' + esc(o.vendorName) + '</div>';
      html += '<div style="font-size:12px;color:#5a5a5a;">\uD83D\uDCCD ' + esc(o.location) + ' &middot; \uD83D\uDCDE ' + esc(o.phone) + '</div>';
      html += '<div style="font-size:12px;color:#7a7a7a;">from ' + esc(o.buyer_display_name) + ' &middot; ' + esc(new Date(o.created_at).toLocaleString()) + ' &middot; pays ' + esc(o.payment_method) + '</div>';
      if (o.notes) html += '<div style="font-size:12px;color:#7a7a7a;font-style:italic;">"' + esc(o.notes) + '"</div>';
      html += '<div class="row-between" style="margin-top:8px;"><div><div class="price">' + money(o.total) + '</div><div style="font-size:11px;color:#9a9a9a;">incl. ' + money(o.delivery_fee) + ' delivery</div></div>';
      if (o.status === "delivered") html += '<span style="background:#dff0d8;color:#2b5a2b;font-size:12px;padding:4px 10px;border-radius:999px;">\u2713 Delivered</span>';
      else html += '<button class="btn btn-primary btn-small" onclick="markDelivered(\'' + esc(o.id) + '\')">Mark delivered</button>';
      html += '</div></div>';
    });
    ordersSlot.innerHTML = html;
  } catch (e) { console.error(e); }
}
function statCard(label, value, sub) {
  return '<div class="stat-card"><div class="stat-label">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div>' + (sub ? '<div style="font-size:10px;color:#9a9a9a;">' + esc(sub) + '</div>' : "") + '</div>';
}
async function markDelivered(id) {
  try { await api("/api/owner/orders/" + id + "/deliver", { method: "PATCH", token: S.ownerToken }); loadOwnerData(); }
  catch (e) { alert(e.message); }
}

/* ---------------- init ---------------- */
if (new URLSearchParams(location.search).get("mgmt") === "movemart-oyin") { S.role = "owner"; }
render();
refreshData();
</script>
</body>
</html>
